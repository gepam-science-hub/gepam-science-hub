                "O-Level Chemistry Practical Notes",

                "General Chemistry practical notes for O-Level students.",

                5000
        }

    alevel: [

        {
            id:
                "notes_physics_alevel_practical",

            title:

            description:
                "General Physics practical notes for A-Level students.",

            price:
                5000
        },


        {
            id:
                "notes_chemistry_alevel_practical",

/* =========================================================
   ELEMENTS
========================================================= */

const container =
    document.getElementById(
        "stepContainer"
    );


const breadcrumb =
    document.getElementById(
        "breadcrumb"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const requestedForm =
        params.get("form");


    if (
        requestedForm &&
        syllabusData[requestedForm]
    ) {

        currentState = {

            level:
                "syllabus",

            form:
                requestedForm,

            syllabus:
                null,

            subject:
                null,

            section:
                "forms"

        };


        renderSyllabus();


        history.replaceState(
            {
                level:
                    "syllabus",

                form:
                    requestedForm,

                syllabus:
                    null,

                subject:
                    null,

                section:
                    "forms"

            },

            "",

            window.location.href
        );

    }

    else {

        currentState = {

            level:
                "home",

            form:
                null,

            syllabus:
                null,

            subject:
                null,

            section:
                null

        };


        renderHome();


        history.replaceState(
            {
                level:
                    "home"
            },

            "",

            window.location.href
        );

    }

}


/* =========================================================
   PUSH HISTORY
========================================================= */

function pushState(
    state
) {

    history.pushState(
        state,
        "",
        window.location.href
    );

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome() {

    currentState.level =
        "home";


    currentState.form =
        null;


    currentState.syllabus =
        null;


    currentState.subject =
        null;


    updateBreadcrumb();

    let html = `

            <h2>
                Chagua Aina ya Notes
            </h2>

            <p>
                Chagua notes za kawaida

            </p>

        </div>


        <div class="selection-grid">

            <div class="selection-card">

                <div>

                    <h3>
                        O-Level & A-Level Notes
                    </h3>

                    <p>
                        Chagua Form 1 mpaka Form 6,
                        syllabus, subject na topic.
                    </p>

                </div>

                <button
                    class="open-btn"
                    onclick="openForms()">

                    FUNGUA FULL NOTES

                </button>

            </div>


            <div class="selection-card practical-card">

                <div>

                    <span class="practical-label">
                        PRACTICAL NOTES
                    </span>

                        Practical Notes
                    </h3>

                    <p>
                        General Physics na Chemistry
                        Practical Notes kwa O-Level
                        na A-Level.
                    </p>

    container.innerHTML =

}


/* =========================================================
   OPEN FORMS
========================================================= */

function openForms() {

    currentState = {

        level:
            "forms",

        form:
            null,

        syllabus:
            null,

        subject:
            null,

        section:
            "full"

    };


    pushState({
        level:
            "forms",

        section:
            "full"
    });


    renderForms();

}


/* =========================================================
   RENDER FORMS
========================================================= */

function renderForms() {

    currentState.level =
        "forms";


    updateBreadcrumb();


    backButton.style.display =
        "inline-flex";


    let html = `

        <div class="step-title">

            <h2>
                Chagua Kidato
            </h2>

            <p>
                Chagua kidato unachotaka
                kupata Premium Notes.
            </p>

        </div>


        <div class="selection-grid">

    `;


    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        const formId =
            "form" + i;


        html += `

            <div class="selection-card">

                <div>

                    <h3>
                        Form ${i}
                    </h3>

                    <p>
                        Premium Physics
                        & Chemistry Notes
                    </p>

                </div>


                <button
                    class="open-btn"
                    onclick="openForm('${formId}')">

                    FUNGUA FORM ${i}

                </button>

            </div>

        `;

    }


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN FORM
========================================================= */

function openForm(
    formId
) {

    currentState = {

        level:
            "syllabus",

        form:
            formId,

        syllabus:
            null,

        subject:
            null,

        section:
            "full"

    };


    pushState({

        level:
            "syllabus",

        form:
            formId,

        section:
            "full"

    });


    renderSyllabus();

}


/* =========================================================
   RENDER SYLLABUS
========================================================= */

function renderSyllabus() {

    const form =
        syllabusData[
            currentState.form
        ];


    if (!form) {

        renderForms();

        return;

    }


    updateBreadcrumb();


    backButton.style.display =
        "inline-flex";


    let html = `

        <div class="step-title">

            <h2>
                ${form.name}
            </h2>

            <p>
                Chagua syllabus.
            </p>

        </div>


        <div class="selection-grid">

            <div class="selection-card syllabus-old">

                <div>

                    <h3>
                        Old Syllabus
                    </h3>

                    <p>
                        Notes zilizopangwa
                        kwa Old Syllabus.
                    </p>

                </div>


                <button
                    class="open-btn"
                    onclick="openSyllabus('old')">

                    FUNGUA OLD SYLLABUS

                </button>

            </div>


            <div class="selection-card syllabus-new">

                <div>

                    <h3>
                        New Syllabus
                    </h3>

                    <p>
                        Notes zilizopangwa
                        kwa New Syllabus.
                    </p>

                </div>


                <button
                    class="open-btn"
                    onclick="openSyllabus('new')">

                    FUNGUA NEW SYLLABUS

                </button>

            </div>

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN SYLLABUS
========================================================= */

function openSyllabus(
    syllabus
) {

    currentState.level =
        "subjects";


    currentState.syllabus =
        syllabus;


    currentState.subject =
        null;


    pushState({

        level:
            "subjects",

        form:
            currentState.form,

        syllabus:
            syllabus,

        section:
            "full"

    });


    renderSubjects();

}


/* =========================================================
   RENDER SUBJECTS
========================================================= */

function renderSubjects() {

    const form =
        syllabusData[
            currentState.form
        ];


    if (!form) {

        renderForms();

        return;

    }


    const syllabus =
        form[
            currentState.syllabus
        ];


    updateBreadcrumb();


    let html = `

        <div class="step-title">

            <h2>
                ${form.name}
                —
                ${syllabus.name}
            </h2>

            <p>
                Chagua subject.
            </p>

        </div>


        <div class="selection-grid">

    `;


    syllabus.subjects.forEach(
        subject => {

            html += `

                <div class="selection-card subject-card">

                    <div>

                        <h3>
                            ${subject}
                        </h3>

                        <p>
                            Full Notes na
                            Topic-by-topic
                            Premium Notes
                        </p>

                    </div>


                    <button
                        class="open-btn"
                        onclick="openSubject('${subject}')">

                        FUNGUA ${subject.toUpperCase()}

                    </button>

                </div>

            `;

        }
    );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN SUBJECT
========================================================= */

function openSubject(
    subject
) {

    currentState.level =
        "topics";


    currentState.subject =
        subject;


    pushState({

        level:
            "topics",

        form:
            currentState.form,

        syllabus:
            currentState.syllabus,

        subject:
            subject,

        section:
            "full"

    });


    renderTopics();

}


/* =========================================================
   RENDER TOPICS
========================================================= */

function renderTopics() {

    updateBreadcrumb();


    const key =
        currentState.form +
        "-" +
        currentState.syllabus +
        "-" +
        currentState.subject
            .toLowerCase();


    const data =
        notesData[key];


    const list =
        data
        ? data.topics || []
        : [];


    const full =
        data
        ? data.full
        : null;


    let html = `

        <div class="step-title">

            <h2>
                ${currentState.subject}
            </h2>

            <p>
                ${syllabusData[
                    currentState.form
                ].name}
                —
                ${
                    currentState.syllabus === "old"
                    ? "Old Syllabus"
                    : "New Syllabus"
                }
            </p>

        </div>

    `;


    /* =====================================================
       FULL NOTES
    ===================================================== */

    if (full) {

        html += `

            <div class="selection-grid">

                <div class="selection-card full-notes-card">

                    <div>

                        <span class="full-notes-label">
                            FULL NOTES
                        </span>

                        <h3>
                            ${full.title}
                        </h3>

                        <p>
                            ${full.description}
                        </p>

                        <div class="topic-price">
                            TSH
                            ${Number(
                                full.price
                            ).toLocaleString()}
                        </div>

                    </div>


                    <button
                        class="buy-btn"
                        onclick="buyTopic(
                            '${escapeForAttribute(full.id)}',
                            '${escapeForAttribute(full.title)}',
                            ${full.price}
                        )">

                        NUNUA FULL NOTES

                    </button>

                </div>

            </div>

        `;

    }


    /* =====================================================
       TOPIC TITLE
    ===================================================== */

    if (list.length > 0) {

        html += `

            <div class="step-title">

                <h2>
                     Topics
                </h2>

                <p>
                    Unaweza pia kununua
                    topic moja moja.
                </p>

            </div>

        `;

    }


    /* =====================================================
       TOPICS
    ===================================================== */

    if (list.length > 0) {

        html += `

            <div class="selection-grid">

        `;


        list.forEach(
            topic => {

                html += `

                    <div class="selection-card topic-card">

                        <div>

                            <h3>
                                ${topic.title}
                            </h3>

                            <p>
                                ${topic.description}
                            </p>

                            <div class="topic-price">
                                TSH
                                ${Number(
                                    topic.price
                                ).toLocaleString()}
                            </div>

                        </div>


                        <button
                            class="buy-btn"
                            onclick="buyTopic(
                                '${escapeForAttribute(topic.id)}',
                                '${escapeForAttribute(topic.title)}',
                                ${topic.price}
                            )">

                            NUNUA TOPIC

                        </button>

                    </div>

                `;

            }
        );


        html += `

            </div>

        `;

    }


    /* =====================================================
       NO TOPICS
    ===================================================== */

    if (
        list.length === 0 &&
        full
    ) {

        html += `

            <div class="selection-card">

                <div>

                    <h3>
                         Topic-by-topic Notes
                    </h3>

                    <p>
                        Topics nyingine zitaongezwa
                        hapa kadri notes zinavyowekwa
                        kwenye mfumo.
                    </p>

                    <span class="future-label">
                        MORE TOPICS COMING
                    </span>

                </div>

            </div>

        `;

    }


    if (
        !full &&
        list.length === 0
    ) {

        html += `

            <div class="selection-card">

                <div>

                    <h3>
                        Premium ${currentState.subject}
                        Notes
                    </h3>

                    <p>
                        Notes za ${currentState.subject}
                        kwa syllabus hii
                        zitaonekana hapa
                        baada ya kuwekwa
                        kwenye database.
                    </p>

                    <span class="future-label">
                        PREMIUM NOTES
                    </span>

                </div>

            </div>

        `;

    }


    container.innerHTML =
        html;

}


/* =========================================================

/* =========================================================
   OPEN PRACTICAL
========================================================= */

function openPractical(
    level
) {

    currentState.level =
        "practical";


    currentState.section =
        level;


    pushState({

        level:
            "practical",

        section:
            level

    });


    renderPractical();

}


/* =========================================================
   RENDER PRACTICAL
========================================================= */

function renderPractical() {

    const level =
        currentState.section;


    const list =
        practicalNotes[level] || [];


    updateBreadcrumb();


    backButton.style.display =
        "inline-flex";


    const levelName =
        level === "olevel"
        ? "O-Level"
        : "A-Level";


    let html = `

        <div class="step-title">

            <h2>
                 ${levelName} Practical Notes
            </h2>

            <p>
                General practical notes
                za Physics na Chemistry.
            </p>

        </div>


        <div class="selection-grid">

    `;


    list.forEach(
        note => {

            html += `

                <div class="selection-card practical-card topic-card">

                    <div>

                        <span class="practical-label">
                            PRACTICAL NOTES
                        </span>

                        <h3>
                            ${note.title}
                        </h3>

                        <p>
                            ${note.description}
                        </p>

                        <div class="topic-price">
                            TSH
                            ${Number(
                                note.price
                            ).toLocaleString()}
                        </div>

                    </div>


                    <button
                        class="buy-btn"
                        onclick="buyTopic(
                            '${escapeForAttribute(note.id)}',
                            '${escapeForAttribute(note.title)}',
                            ${note.price}
                        )">

                        NUNUA PRACTICAL NOTES

                    </button>

                </div>

            `;

        }
    );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   PAYMENT
=========================================================

   MUHIMU SANA:

   HII FUNCTION HAIJABADILISHWA KIMANTIKI.

   Bado inaita:

   anzishaUnunuziWaNotes()

   kutoka notes.js yako iliyopo.

   Kwa hiyo PesaPal payment engine yako
   haijaguswa.
========================================================= */

function buyTopic(
    notesId,
    title,
    price
) {

    if (
        typeof anzishaUnunuziWaNotes !==
        "function"
    ) {

        alert(
            "Payment system haijapakia vizuri. Tafadhali refresh page."
        );

        return;

    }


    anzishaUnunuziWaNotes(
        notesId,
        title,
        price
    );

}


/* =========================================================
   BACK BUTTON
========================================================= */

function goBack() {

    if (
        currentState.level ===
        "home"
    ) {

        window.location.href =
            "index.html";

        return;

    }


    history.back();

}


/* =========================================================
   BROWSER / ANDROID BACK
========================================================= */

window.addEventListener(
    "popstate",
    function(event) {

        const state =
            event.state;


        if (!state) {

            renderHome();

            return;

        }


        currentState.level =
            state.level || "home";


        currentState.form =
            state.form || null;


        currentState.syllabus =
            state.syllabus || null;


        currentState.subject =
            state.subject || null;


        currentState.section =
            state.section || null;


        if (
            currentState.level ===
            "home"
        ) {

            renderHome();

        }

        else if (
            currentState.level ===
            "forms"
        ) {

            renderForms();

        }

        else if (
            currentState.level ===
            "syllabus"
        ) {

            renderSyllabus();

        }

        else if (
            currentState.level ===
            "subjects"
        ) {

            renderSubjects();

        }

        else if (
            currentState.level ===
            "topics"
        ) {

            renderTopics();

        }

        else if (
            currentState.level ===
            "practicalLevels"
        ) {

            renderPracticalLevels();

        }

        else if (
            currentState.level ===
            "practical"
        ) {

            renderPractical();

        }

        else {

            renderHome();

        }

    }
);


/* =========================================================
   BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    let parts = [
        "Premium Notes"
    ];


    if (
        currentState.level ===
            "home"
    ) {

        breadcrumb.innerHTML =
            "<span>Premium Notes</span>";

        return;

    }


    if (
        currentState.section ===
        "practical"
    ) {

        parts.push(
            "Practical Notes"
        );

    }


    if (
        currentState.section ===
        "olevel"
    ) {

        parts.push(
            "O-Level Practical"
        );

    }


    if (
        currentState.section ===
        "alevel"
    ) {

        parts.push(
            "A-Level Practical"
        );

    }


    if (
        currentState.form
    ) {

        const form =
            syllabusData[
                currentState.form
            ];


        if (form) {

            parts.push(
                form.name
            );

        }

    }


    if (
        currentState.syllabus
    ) {

        parts.push(

            currentState.syllabus === "old"
            ? "Old Syllabus"
            : "New Syllabus"

        );

    }


    if (
        currentState.subject
    ) {

        parts.push(
            currentState.subject
        );

    }


    breadcrumb.innerHTML =
        parts.map(
            (part, index) => {

                if (
                    index === 0
                ) {

                    return `
                        <span>
                            ${part}
                        </span>
                    `;

                }


                return `
                    <span class="separator">
                        ›
                    </span>

                    <span>
                        ${part}
                    </span>
                `;

            }
        ).join("");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeForAttribute(
    value
) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleMenu() {

    const sidebar =
        document.getElementById(
            "sidebarMenu"
        );


    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    sidebar.classList.toggle(
        "active"
    );


    overlay.style.display =
        sidebar.classList.contains(
            "active"
        )
        ? "block"
        : "none";

}


/* =========================================================
   DROPDOWN
========================================================= */

function toggleDropdown(
    button
) {

    const dropdown =
        button.nextElementSibling;


    if (!dropdown) {

        return;

    }


    const isOpen =
        dropdown.style.display ===
        "block";


    dropdown.style.display =
        isOpen
        ? "none"
        : "block";

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
