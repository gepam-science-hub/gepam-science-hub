    color: #333;

.sidebar-links a:hover,

.dropdown-container {

.dropdown-container a {

========================================================= */

.overlay {

/* =========================================================
   BROWSER / ANDROID BACK
========================================================= */

window.addEventListener(
    "popstate",
    function(event) {

        const state =
            event.state;


        if (!state) {

            renderHome();

            return;

        }


        currentState.level =
            state.level || "home";


        currentState.form =
            state.form || null;


        currentState.syllabus =
            state.syllabus || null;


        currentState.subject =
            state.subject || null;


        currentState.section =
            state.section || null;


        if (
            currentState.level ===
            "home"
        ) {

            renderHome();

        }

        else if (
            currentState.level ===
            "forms"
        ) {

            renderForms();

        }

        else if (
            currentState.level ===
            "syllabus"
        ) {

            renderSyllabus();

        }

        else if (
            currentState.level ===
            "subjects"
        ) {

            renderSubjects();

        }

        else if (
            currentState.level ===
            "topics"
        ) {

            renderTopics();

        }

        else if (
            currentState.level ===
            "practicalLevels"
        ) {

            renderPracticalLevels();

        }

        else if (
            currentState.level ===
            "practical"
        ) {

            renderPractical();

        }

        else {

            renderHome();

        }

    }
);


/* =========================================================
   BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    let parts = [
        "Premium Notes"
    ];


    if (
        currentState.level ===
            "home"
    ) {

        breadcrumb.innerHTML =
            "<span>Premium Notes</span>";

        return;

    }


    if (
        currentState.section ===
        "practical"
    ) {

        parts.push(
            "Practical Notes"
        );

    }


    if (
        currentState.section ===
        "olevel"
    ) {

        parts.push(
            "O-Level Practical"
        );

    }


    if (
        currentState.section ===
        "alevel"
    ) {

        parts.push(
            "A-Level Practical"
        );

    }


    if (
        currentState.form
    ) {

        const form =
            syllabusData[
                currentState.form
            ];


        if (form) {

            parts.push(
                form.name
            );

        }

    }


    if (
        currentState.syllabus
    ) {

        parts.push(

            currentState.syllabus === "old"
            ? "Old Syllabus"
            : "New Syllabus"

        );

    }


    if (
        currentState.subject
    ) {

        parts.push(
            currentState.subject
        );

    }


    breadcrumb.innerHTML =
        parts.map(
            (part, index) => {

                if (
                    index === 0
                ) {

                    return `
                        <span>
                            ${part}
                        </span>
                    `;

                }


                return `
                    <span class="separator">
                        ›
                    </span>

                    <span>
                        ${part}
                    </span>
                `;

            }
        ).join("");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeForAttribute(
    value
) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}

   SIDEBAR
========================================================= */

function toggleMenu() {

    const sidebar =
        document.getElementById(
            "sidebarMenu"
        );


    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    sidebar.classList.toggle(
        "active"
    );


    overlay.style.display =
        sidebar.classList.contains(
            "active"
        )
        ? "block"
        : "none";

}


/* =========================================================
   DROPDOWN
========================================================= */

function toggleDropdown(
    button
) {

    const dropdown =
        button.nextElementSibling;


    if (!dropdown) {

        return;

    }


    const isOpen =
        dropdown.style.display ===
        "block";


    dropdown.style.display =
        isOpen
        ? "none"
        : "block";

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
