/* =========================================================

========================================================= */

function initialize() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const requestedForm =
        params.get("form");

    if (
        requestedForm &&
        syllabusData[requestedForm]
    ) {

        currentState.level =
            "syllabus";

        currentState.form =
            requestedForm;

        renderSyllabus();

        history.replaceState(
            {
                level: "syllabus",
                form: requestedForm
            },
            "",
            window.location.href
        );

    } else {

        currentState.level =
            "forms";

        renderForms();

        history.replaceState(
            {
                level: "forms"
            },
            "",
            window.location.href
        );

    }

    historyReady = true;

}

   SAVE HISTORY
========================================================= */

    state
) {

    history.pushState(
        state,
        "",
        window.location.href
    );

}

            <h2>
                ${form.name}
                —
                ${syllabus.name}
            </h2>

            <p>
                Chagua subject.
            </p>

        </div>

        <div class="selection-grid">

    `;


    syllabus.subjects.forEach(
        subject => {

            const icon =
                subject === "Physics"
                ? "⚛️"
                : "🧪";


            html += `

                <div class="selection-card subject-card">

                    <div>

                        <div class="subject-icon">
                            ${icon}
                        </div>

                        <h3>
                            ${subject}
                        </h3>

                        <p>
                            Topic-by-topic
                            Premium Notes
                        </p>

                    </div>

                    <button
                        class="open-btn"
                        onclick="openSubject('${subject}')">

                        FUNGUA ${subject.toUpperCase()}

                    </button>

                </div>

            `;

        }
    );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN SUBJECT
========================================================= */

function openSubject(
    subject
) {

    currentState.level =
        "topics";

    currentState.subject =
        subject;


    pushState({

        level:
            "topics",

        form:
            currentState.form,

        syllabus:
            currentState.syllabus,

        subject:
            subject

    });


    renderTopics();

}


/* =========================================================
   RENDER TOPICS
========================================================= */

function renderTopics() {

    updateBreadcrumb();


    const key =
        currentState.form +
        "-" +
        currentState.syllabus +
        "-" +
        currentState.subject
            .toLowerCase();


    const list =
        topics[key] || [];


    let html = `

        <div class="step-title">

            <h2>
                ${currentState.subject}
            </h2>

            <p>
                ${syllabusData[
                    currentState.form
                ].name}
                —
                ${
                    currentState.syllabus === "old"
                    ? "Old Syllabus"
                    : "New Syllabus"
                }
            </p>

        </div>

        <div class="selection-grid">

    `;


    /*
    =========================================================
    TOPICS ZILIZOPO
    =========================================================
    */

    list.forEach(
        topic => {

            html += `

                <div class="selection-card topic-card">

                    <div>

                        <h3>
                            ${topic.title}
                        </h3>

                        <p>
                            ${topic.description}
                        </p>

                        <div class="topic-price">
                            TSH
                            ${Number(
                                topic.price
                            ).toLocaleString()}
                        </div>

                    </div>

                    <button
                        class="buy-btn"
                        onclick="buyTopic(
                            '${escapeForAttribute(topic.id)}',
                            '${escapeForAttribute(topic.title)}',
                            ${topic.price}
                        )">

                        NUNUA TOPIC

                    </button>

                </div>

            `;

        }
    );


    /*
    =========================================================
    IF NO RECORDS YET
    =========================================================
    */

    if (list.length === 0) {

        html += `

            <div class="selection-card">

                <div>

                    <h3>
                        📚 Premium ${currentState.subject}
                        Notes
                    </h3>

                    <p>
                        Topics za ${currentState.subject}
                        kwa syllabus hii
                        zitaonekana hapa
                        mara tu zitakapowekwa
                        kwenye mfumo wa notes.
                    </p>

                    <span class="future-label">
                        PREMIUM NOTES
                    </span>

                </div>

            </div>

        `;

    }


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}

   PAYMENT
========================================================= */

/* =========================================================
   BACK BUTTON
========================================================= */

function goBack() {

    if (
        currentState.level ===
        "forms"
    ) {

        window.location.href =
            "index.html";

        return;

    }


    history.back();

}


/* =========================================================
   BROWSER / ANDROID BACK
========================================================= */

window.addEventListener(
    "popstate",
    function(event) {

        const state =
            event.state;


        if (!state) {

            renderForms();

            return;

        }


        currentState.level =
            state.level || "forms";

        currentState.form =
            state.form || null;

        currentState.syllabus =
            state.syllabus || null;

        currentState.subject =
            state.subject || null;


        if (
            currentState.level ===
            "forms"
        ) {

            renderForms();

        }

        else if (
            currentState.level ===
            "syllabus"
        ) {

            renderSyllabus();

        }

        else if (
            currentState.level ===
            "subjects"
        ) {

            renderSubjects();

        }

        else if (
            currentState.level ===
            "topics"
        ) {

            renderTopics();

        }

    }
);


/* =========================================================
   BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    let parts = [
        "Premium Notes"
    ];


    if (
        currentState.form
    ) {

        parts.push(
            syllabusData[
                currentState.form
            ].name
        );

    }


    if (
        currentState.syllabus
    ) {

        parts.push(

            currentState.syllabus === "old"
            ? "Old Syllabus"
            : "New Syllabus"

        );

    }


    if (
        currentState.subject
    ) {

        parts.push(
            currentState.subject
        );

    }


    breadcrumb.innerHTML =
        parts.map(
            (part, index) => {

                if (
                    index === 0
                ) {

                    return `
                        <span>
                            ${part}
                        </span>
                    `;

                }


                return `
                    <span class="separator">
                        ›
                    </span>

                    <span>
                        ${part}
                    </span>
                `;

            }
        ).join("");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeForAttribute(
    value
) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleMenu() {

    const sidebar =
        document.getElementById(
            "sidebarMenu"
        );

    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    sidebar.classList.toggle(
        "active"
    );


    overlay.style.display =
        sidebar.classList.contains(
            "active"
        )
        ? "block"
        : "none";

}


/* =========================================================
   DROPDOWN
========================================================= */

function toggleDropdown(
    button
) {

    const container =
        button.nextElementSibling;


    if (
        !container
    ) {

        return;

    }


    const isOpen =
        container.style.display ===
        "block";


    container.style.display =
        isOpen
        ? "none"
        : "block";

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
