<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

          type="image/png"

          href="style.css">

    <!-- =====================================================
         PAST PAPERS PAGE ONLY
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            overflow-x: hidden;
        }

        /* =================================================
           HEADER
        ================================================= */

        .pp-header {
            width: 100%;
            background: #172554;
            color: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .pp-header-inner {
            max-width: 1050px;
            margin: auto;
            padding: 13px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pp-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pp-brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .pp-brand-text {
            display: flex;
            flex-direction: column;
        }

        .pp-brand-name {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
        }

        .pp-brand-tagline {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 3px;
        }

        .pp-menu-btn {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 24px;
            cursor: pointer;
        }

        .pp-menu-btn:hover {
            background: #1d4ed8;
        }


        /* =================================================
           SIDEBAR
        ================================================= */

        .pp-overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.48);

            z-index: 9998;
        }

        .pp-overlay.active {
            display: block;
        }

        .pp-sidebar {
            position: fixed;

            top: 0;
            right: -300px;

            width: 285px;
            height: 100vh;

            background: white;

            box-shadow: -8px 0 25px rgba(0,0,0,0.18);

            z-index: 9999;

            transition: right 0.3s ease;

            padding: 20px;

            overflow-y: auto;
        }

        .pp-sidebar.active {
            right: 0;
        }

        .pp-close {
            float: right;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 8px;

            background: #e2e8f0;

            font-size: 22px;

            cursor: pointer;
        }

        .pp-sidebar-links {
            clear: both;

            padding-top: 55px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .pp-sidebar-links a {
            text-decoration: none;

            padding: 13px 14px;

            border-radius: 9px;

            color: #172033;

            font-weight: 700;

            background: #f8fafc;
        }

        .pp-sidebar-links a:hover {
            background: #dbeafe;
            color: #1d4ed8;
        }


        /* =================================================
           MAIN
        ================================================= */

        .pp-main {
            max-width: 1050px;

            margin: auto;

            padding:
                25px 18px 60px;
        }


        /* =================================================
           PAGE HERO
        ================================================= */

        .pp-hero {
            background:
                linear-gradient(
                    135deg,
                    #172554,
                    #1e40af
                );

            color: white;

            border-radius: 18px;

            padding: 30px 22px;

            margin-bottom: 22px;

            box-shadow:
                0 8px 25px rgba(30,64,175,0.20);
        }

        .pp-hero-icon {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .pp-hero h1 {
            margin: 0 0 8px;

            font-size: 30px;
        }

        .pp-hero p {
            margin: 0;

            color: #dbeafe;

            line-height: 1.6;

            max-width: 650px;
        }


        /* =================================================
           BREADCRUMB
        ================================================= */

        .pp-breadcrumb {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 7px;

            margin-bottom: 17px;

            font-size: 14px;

            color: #64748b;
        }

        .pp-breadcrumb strong {
            color: #172554;
        }

        .pp-separator {
            color: #94a3b8;
        }


        /* =================================================
           BACK BUTTON
        ================================================= */

        .pp-back {
            display: none;

            border: none;

            background: #334155;

            color: white;

            padding: 11px 17px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            margin-bottom: 20px;
        }

        .pp-back:hover {
            background: #1e293b;
        }


        /* =================================================
           STEP HEADING
        ================================================= */

        .pp-step-heading {
            text-align: center;

            margin:
                10px auto 22px;

            max-width: 700px;
        }

        .pp-step-number {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 36px;
            height: 36px;

            border-radius: 50%;

            background: #2563eb;

            color: white;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .pp-step-heading h2 {
            margin: 0 0 7px;

            font-size: 25px;

            color: #172554;
        }

        .pp-step-heading p {
            margin: 0;

            color: #64748b;

            line-height: 1.5;
        }


        /* =================================================
           CARDS GRID
        ================================================= */

        .pp-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 18px;
        }


        /* =================================================
           CARD
        ================================================= */

        .pp-card {
            background: white;

            border: 1px solid #dbe4f0;

            border-top:
                5px solid #2563eb;

            border-radius: 14px;

            padding: 21px;

            min-height: 165px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            box-shadow:
                0 5px 16px rgba(15,23,42,0.06);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .pp-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 25px rgba(15,23,42,0.11);
        }

        .pp-card-icon {
            font-size: 34px;

            margin-bottom: 8px;
        }

        .pp-card h3 {
            margin:
                0 0 7px;

            font-size: 19px;

            color: #172554;
        }

        .pp-card p {
            margin: 0;

            color: #64748b;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =================================================
           OPEN BUTTON
        ================================================= */

        .pp-open {
            width: 100%;

            margin-top: 17px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-weight: 800;

            font-size: 14px;

            cursor: pointer;
        }

        .pp-open:hover {
            background: #1d4ed8;
        }


        /* =================================================
           SUBJECT COLORS
        ================================================= */

        .pp-physics {
            border-top-color: #7c3aed;
        }

        .pp-physics .pp-open {
            background: #7c3aed;
        }

        .pp-physics .pp-open:hover {
            background: #6d28d9;
        }

        .pp-chemistry {
            border-top-color: #059669;
        }

        .pp-chemistry .pp-open {
            background: #059669;
        }

        .pp-chemistry .pp-open:hover {
            background: #047857;
        }


        /* =================================================
           TYPE COLORS
        ================================================= */

        .pp-type-necta {
            border-top-color: #dc2626;
        }

        .pp-type-mock {
            border-top-color: #ea580c;
        }

        .pp-type-pre {
            border-top-color: #0891b2;
        }

        .pp-type-joint {
            border-top-color: #7c3aed;
        }

        .pp-type-annual {
            border-top-color: #2563eb;
        }

        .pp-type-midterm {
            border-top-color: #16a34a;
        }

        .pp-type-terminal {
            border-top-color: #9333ea;
        }

        .pp-type-ftna {
            border-top-color: #dc2626;
        }

        .pp-type-acsee {
            border-top-color: #b91c1c;
        }


        /* =================================================
           REGION
        ================================================= */

        .pp-region {
            border-top-color: #0f766e;
        }

        .pp-region .pp-open {
            background: #0f766e;
        }

        .pp-region .pp-open:hover {
            background: #115e59;
        }


        /* =================================================
           YEAR
        ================================================= */

        .pp-year {
            border-top-color: #d97706;

            min-height: 145px;
        }

        .pp-year .pp-open {
            background: #d97706;
        }

        .pp-year .pp-open:hover {
            background: #b45309;
        }


        /* =================================================
           PDF PAPER CARD
        ================================================= */

        .pp-paper {
            border-top-color: #be123c;

            min-height: 190px;
        }

        .pp-paper .pp-open {
            background: #be123c;
        }

        .pp-paper .pp-open:hover {
            background: #9f1239;
        }

        .pp-paper-icon {
            font-size: 34px;

            margin-bottom: 8px;
        }


        /* =================================================
           EMPTY / ERROR
        ================================================= */

        .pp-message {
            background: white;

            border: 1px solid #dbe4f0;

            border-radius: 14px;

            padding: 25px;

            text-align: center;

            color: #64748b;
        }


        /* =================================================
           FOOTER
        ================================================= */

        .pp-footer {
            margin-top: 35px;

            background: #172554;

            color: white;

            text-align: center;

            padding: 25px 15px;

            font-size: 14px;
        }

        .pp-footer strong {
            display: block;

            margin-bottom: 5px;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .pp-main {
                padding:
                    18px 14px 50px;
            }

            .pp-hero {
                padding: 25px 18px;
                border-radius: 14px;
            }

            .pp-hero h1 {
                font-size: 25px;
            }

            .pp-grid {
                grid-template-columns: 1fr;
            }

            .pp-card {
                min-height: 150px;
            }

            .pp-step-heading h2 {
                font-size: 22px;
            }

        }

    </style>

</head>

<!-- =====================================================
     ONLY SIDEBAR FUNCTIONS
====================================================== -->

<script>

function ppToggleMenu() {

    const sidebar =
        document.getElementById(
            "ppSidebar"
        );

    const overlay =
        document.getElementById(
            "ppOverlay"
        );


    const isOpen =
        sidebar.classList.contains(
            "active"
        );


    if (isOpen) {

        sidebar.classList.remove(
            "active"
        );

        overlay.classList.remove(
            "active"
        );

    } else {

        sidebar.classList.add(
            "active"
        );

        overlay.classList.add(
            "active"
        );

    }

}

</script>
