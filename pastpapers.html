<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GEPAM Science Hub | Past Papers</title>

<link rel="icon"
      type="image/png"
      href="file_00000000f17471f4b8f76a744122207a.png">

<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    background: #f5f8fb;

    color: #222;

    overflow-x: hidden;
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.nav-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    max-width: 1000px;

    margin: 0 auto;

    padding: 15px 20px;

    background: #fff;

    border-bottom: 1px solid #e5e5e5;
}

.logo-area {

    display: flex;

    align-items: center;

    gap: 10px;
}

.logo-area img {

    height: 42px;

    width: auto;
}

.logo-title {

    font-size: 18px;

    font-weight: bold;

    color: #003366;
}

.menu-toggle {

    font-size: 28px;

    background: none;

    border: none;

    cursor: pointer;

    color: #003366;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    top: 0;

    right: -290px;

    width: 280px;

    height: 100%;

    background: #fff;

    box-shadow:
        -5px 0 20px rgba(0,0,0,0.15);

    transition: right 0.3s ease;

    z-index: 10000;

    padding: 20px;

    overflow-y: auto;
}

.sidebar.active {

    right: 0;
}

.close-btn {

    float: right;

    font-size: 25px;

    background: none;

    border: none;

    cursor: pointer;

    color: #333;
}

.sidebar-links {

    margin-top: 60px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.sidebar-links a {

    display: block;

    padding: 13px;

    text-decoration: none;

    color: #333;

    font-weight: bold;

    border-radius: 7px;
}

.sidebar-links a:hover {

    background: #e9f8ee;

    color: #00a83b;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.45);

    z-index: 9999;
}


/* =========================================================
   MAIN
========================================================= */

.main-container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 25px 20px 60px;
}


/* =========================================================
   HERO
========================================================= */

.page-header {

    text-align: center;

    margin-bottom: 25px;

    padding: 25px 15px;

    background: linear-gradient(
        135deg,
        #003366,
        #005c99
    );

    border-radius: 14px;

    color: #fff;

    box-shadow:
        0 8px 20px rgba(0,51,102,0.15);
}

.page-header .icon {

    font-size: 45px;

    margin-bottom: 5px;
}

.page-header h1 {

    margin: 5px 0 8px;

    font-size: 29px;
}

.page-header p {

    margin: 0;

    color: #e8f4ff;

    line-height: 1.6;

    font-size: 15px;
}


/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 18px;

    padding: 12px 14px;

    background: #fff;

    border-radius: 8px;

    border-left: 4px solid #00b83d;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.05);

    font-size: 14px;

    color: #666;
}

.breadcrumb span {

    font-weight: bold;

    color: #333;
}

.breadcrumb .separator {

    color: #aaa;

    font-weight: normal;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {

    display: none;

    align-items: center;

    justify-content: center;

    gap: 7px;

    padding: 11px 18px;

    margin-bottom: 20px;

    background: #333;

    color: #fff;

    border: none;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;
}

.back-btn:hover {

    background: #111;
}


/* =========================================================
   STEP TITLE
========================================================= */

.step-title {

    text-align: center;

    margin: 15px 0 22px;
}

.step-number {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 38px;

    height: 38px;

    border-radius: 50%;

    background: #00b83d;

    color: #fff;

    font-weight: bold;

    margin-bottom: 8px;

    box-shadow:
        0 4px 10px rgba(0,184,61,0.25);
}

.step-title h2 {

    margin: 5px 0 7px;

    font-size: 24px;

    color: #003366;
}

.step-title p {

    margin: 0;

    color: #666;

    line-height: 1.5;
}


/* =========================================================
   SELECTION GRID
========================================================= */

.selection-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 18px;

    margin-top: 20px;
}


/* =========================================================
   CARD
========================================================= */

.selection-card {

    position: relative;

    background: #fff;

    border: 1px solid #e2e7eb;

    border-top: 5px solid #00b83d;

    border-radius: 11px;

    padding: 22px;

    min-height: 165px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.06);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.selection-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 9px 22px rgba(0,0,0,0.10);
}


/* =========================================================
   CARD ICON
========================================================= */

.card-icon {

    font-size: 36px;

    margin-bottom: 8px;
}


/* =========================================================
   CARD TEXT
========================================================= */

.selection-card h3 {

    margin: 0 0 8px;

    color: #003366;

    font-size: 19px;
}

.selection-card p {

    margin: 0;

    color: #666;

    font-size: 14px;

    line-height: 1.55;
}


/* =========================================================
   OPEN BUTTON
========================================================= */

.open-btn {

    width: 100%;

    padding: 12px;

    margin-top: 18px;

    border: none;

    border-radius: 7px;

    background: #00b83d;

    color: #fff;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.open-btn:hover {

    background: #008f30;

    transform: translateY(-1px);
}


/* =========================================================
   PDF BUTTON
========================================================= */

.pdf-btn {

    background: #003366;
}

.pdf-btn:hover {

    background: #002244;
}


/* =========================================================
   PAPER CARD
========================================================= */

.paper-card {

    border-top-color: #003366;

    min-height: 180px;
}


/* =========================================================
   YEAR CARD
========================================================= */

.year-card {

    border-top-color: #ff9800;
}


/* =========================================================
   REGION CARD
========================================================= */

.region-card {

    border-top-color: #00a83b;
}


/* =========================================================
   SUBJECT CARD
========================================================= */

.physics-card {

    border-top-color: #1565c0;
}

.chemistry-card {

    border-top-color: #8e24aa;
}


/* =========================================================
   TYPE CARD
========================================================= */

.type-card {

    border-top-color: #00897b;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-box {

    background: #fff;

    border: 1px solid #ddd;

    border-left: 5px solid #ff9800;

    border-radius: 9px;

    padding: 25px;

    text-align: center;

    color: #666;

    line-height: 1.6;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align: center;

    padding: 30px 15px;

    margin-top: 40px;

    background: #003366;

    color: #fff;
}

.footer strong {

    display: block;

    font-size: 17px;

    margin-bottom: 6px;
}

.footer p {

    margin: 0;

    color: #dcecff;

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .main-container {

        padding:
            18px 14px 50px;
    }

    .nav-header {

        padding:
            13px 15px;
    }

    .logo-area img {

        height: 36px;
    }

    .logo-title {

        font-size: 16px;
    }

    .page-header {

        padding: 22px 14px;
    }

    .page-header h1 {

        font-size: 24px;
    }

    .page-header .icon {

        font-size: 38px;
    }

    .step-title h2 {

        font-size: 21px;
    }

    .selection-grid {

        grid-template-columns: 1fr;

        gap: 14px;
    }

    .selection-card {

        min-height: 150px;

        padding: 19px;
    }

}

</style>

</head>


<body>

     HEADER
========================================================= -->

<header class="nav-header">

    <div class="logo-area">

        <img
            src="file_00000000f17471f4b8f76a744122207a.png"

        <span class="logo-title">

        </span>

    </div>


    <button

</header>


<!-- ========================================================

========================================================= -->

<main class="main-container">


    <section class="page-header">

        <div class="icon">

        </div>

        </h1>

        <p>

        </p>

    </section>


    <!-- BREADCRUMB -->

    <div
        class="breadcrumb"

    </div>

    <button

</main>


<!-- ========================================================

    <div class="sidebar-links">

        <a href="index.html">

<!-- ========================================================

     DATA
========================================================= -->

<script src="pastpapers.data.js"></script>


<!-- ========================================================

========================================================= -->

<script src="pastpapers.js"></script>


<!-- ========================================================
     MENU
========================================================= -->

<script>

function toggleMenu() {

    const sidebar =
        document.getElementById(
            "sidebarMenu"
        );

    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    sidebar.classList.toggle(
        "active"
    );


    overlay.style.display =
        sidebar.classList.contains(
            "active"
        )
        ? "block"
        : "none";

}

</script>


</body>
