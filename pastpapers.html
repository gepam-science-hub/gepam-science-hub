<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GEPAM Science Hub | Past Papers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #222;
        }

        header {
            background: #003366;
            color: white;
            padding: 14px 18px;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #003366;
            font-weight: bold;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 20px;
        }

        .brand-text p {
            margin: 3px 0 0;
            font-size: 12px;
            opacity: .9;
        }

        .menu-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,.5);
            color: white;
            font-size: 25px;
            padding: 5px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .nav {
            display: none;
            background: #00264d;
            padding: 10px 18px;
        }

        .nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 0;
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 20px 15px 50px;
        }

        .back-btn {
            border: none;
            background: #003366;
            color: white;
            padding: 10px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 18px;
        }

        .back-btn:hover {
            background: #00509e;
        }

        .intro {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .intro h2 {
            color: #003366;
            margin-top: 0;
        }

        .intro p {
            color: #555;
            line-height: 1.6;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin: 10px 0 18px;
        }

        .breadcrumb span {
            color: #003366;
            font-weight: bold;
        }

        .chain-title {
            color: #003366;
            margin-bottom: 15px;
        }

        .chain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 15px;
        }

        .chain-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            min-height: 120px;
            cursor: pointer;
            border: 1px solid #e1e8ef;
            box-shadow: 0 3px 10px rgba(0,0,0,.05);
            transition: .2s;
        }

        .chain-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(0,0,0,.10);
            border-color: #003366;
        }

        .chain-card h3 {
            margin: 0 0 8px;
            color: #003366;
            font-size: 18px;
        }

        .chain-card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .paper-list {
            display: grid;
            gap: 12px;
        }

        .paper-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            border-left: 5px solid #003366;
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
        }

        .paper-card h3 {
            margin: 0 0 8px;
            color: #003366;
        }

        .paper-card p {
            margin: 5px 0;
            color: #555;
        }

        .open-pdf {
            display: inline-block;
            margin-top: 10px;
            background: #003366;
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 6px;
        }

        .open-pdf:hover {
            background: #00509e;
        }

        .empty {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 13px;
        }

        @media (min-width: 700px) {
            .menu-btn {
                display: none;
            }

            .nav {
                display: block;
                background: #00264d;
            }

            .nav-inner {
                max-width: 1100px;
                margin: auto;
                display: flex;
                gap: 25px;
            }

            .nav a {
                display: inline-block;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="brand">
            <div class="brand-logo">GS</div>

            <div class="brand-text">
                <h1>GEPAM Science Hub</h1>
                <p>Making Science Easy</p>
            </div>
        </div>

        <button class="menu-btn" id="menuBtn">☰</button>

    </div>
</header>

<nav class="nav" id="mobileNav">
    <div class="nav-inner">
        <a href="index.html">Home</a>
        <a href="notes.html">Notes</a>
        <a href="pastpapers.html">Past Papers</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<main class="page">

    <button id="backBtn" class="back-btn">
        ← Back
    </button>

    <div class="intro">
        <h2>Past Papers</h2>
        <p>
            Find Physics and Chemistry examination papers from
            Form 1 to Form 6. Navigate through the categories
            step by step until you reach the required paper.
        </p>
    </div>

    <div id="breadcrumb" class="breadcrumb"></div>

    <h2 id="chainTitle" class="chain-title"></h2>

    <div id="chainContainer" class="chain-grid"></div>

</main>

<footer>
    © 2026 GEPAM Science Hub. All Rights Reserved.
</footer>

<script src="data.js"></script>
<script src="pastpapers.js"></script>

</body>
</html>
