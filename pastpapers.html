<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="GEPAM Science Hub Past Papers - Physics and Chemistry examination papers from Form 1 to Form 6.">

<meta name="theme-color"
      content="#0d47a1">

<title>GEPAM Science Hub | Past Papers</title>

<link rel="icon"
      type="image/png"
      href="file_00000000f17471f4b8f76a744122207a.png">

<link rel="stylesheet"
      href="style.css">

<script src="pastpapers-data.js"></script>

<style>

:root {
    --primary: #1769aa;
    --primary-dark: #0d47a1;
    --secondary: #00a6a6;
    --light-blue: #eef7ff;
    --text: #172033;
    --muted: #687386;
    --white: #ffffff;
    --border: #dce5ee;
    --shadow: 0 8px 25px rgba(23,105,170,.10);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(
            180deg,
            #f5faff 0%,
            #ffffff 55%,
            #f5faff 100%
        );
    color: var(--text);
    overflow-x: hidden;
}

/* =========================================================
   HEADER
========================================================= */

.nav-header {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-area img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--primary-dark);
}

.logo-subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
}

.menu-toggle {
    width: 45px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );
    color: white;
    font-size: 24px;
    cursor: pointer;
}

/* =========================================================
   MAIN
========================================================= */

.main-container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 25px 20px 60px;
}

/* =========================================================
   HERO
========================================================= */

.page-hero {
    padding: 32px 25px;
    border-radius: 20px;
    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #1769aa 55%,
            #00a6a6
        );
    color: white;
    box-shadow:
        0 12px 30px
        rgba(13,71,161,.22);
    margin-bottom: 25px;
}

.page-hero h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.page-hero p {
    margin: 0;
    line-height: 1.7;
    color: #e8f4ff;
}

/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 18px;
    font-size: 14px;
}

.breadcrumb-item {
    padding: 6px 10px;
    border-radius: 20px;
    background: #e9f3fb;
    color: var(--primary-dark);
    font-weight: 700;
}

.breadcrumb-separator {
    color: #9aa7b5;
    font-weight: bold;
}

/* =========================================================
   BACK
========================================================= */

.back-btn {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    margin-bottom: 20px;
    border: none;
    border-radius: 9px;
    background: #263746;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.back-btn:hover {
    background: #172631;
}

/* =========================================================
   STEP
========================================================= */

.step-header {
    margin: 10px 0 20px;
}

.step-number {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #dff6f6;
    color: #007c7c;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 8px;
}

.step-header h2 {
    margin: 0 0 7px;
    font-size: 25px;
}

.step-header p {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
}

/* =========================================================
   STATUS
========================================================= */

.data-status {
    display: none;
    margin: 0 0 20px;
    padding: 13px 15px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
}

.data-status.error {
    display: block;
    background: #ffebee;
    border: 1px solid #ffcdd2;
    color: #b71c1c;
}

/* =========================================================
   GRID
========================================================= */

.selection-grid {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );
    gap: 18px;
}

/* =========================================================
   CARD
========================================================= */

.selection-card {
    position: relative;
    background: rgba(255,255,255,.98);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    min-height: 185px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.selection-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 5px;
    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );
}

.selection-card:hover {
    transform: translateY(-5px);
    box-shadow:
        0 14px 30px
        rgba(23,105,170,.15);
}

.selection-card h3 {
    margin: 0 0 8px;
    font-size: 20px;
    color: #17324d;
}

.selection-card p {
    margin: 0;
    color: var(--muted);
    line-height: 1.55;
    font-size: 14px;
}

.form-card {
    min-height: 180px;
}

.form-card::before {
    background:
        linear-gradient(
            90deg,
            #1769aa,
            #00a6a6
        );
}

.physics-card::before {
    background:
        linear-gradient(
            90deg,
            #1565c0,
            #42a5f5
        );
}

.chemistry-card::before {
    background:
        linear-gradient(
            90deg,
            #00897b,
            #26a69a
        );
}

.region-card::before {
    background:
        linear-gradient(
            90deg,
            #00695c,
            #26a69a
        );
}

.year-card::before {
    background:
        linear-gradient(
            90deg,
            #283593,
            #5c6bc0
        );
}

.type-card::before {
    background:
        linear-gradient(
            90deg,
            #7b1fa2,
            #ab47bc
        );
}

/* =========================================================
   EXAMINATION SERIES
========================================================= */

.series-card::before {
    background:
        linear-gradient(
            90deg,
            #ad1457,
            #7b1fa2
        );
}

.series-card {
    min-height: 180px;
}

.series-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 14px;
}

.series-item {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #e1d5eb;
    border-radius: 9px;
    background: #faf6fc;
    color: #5b176d;
    font-weight: 800;
    text-align: left;
    cursor: pointer;
    transition:
        background .15s ease,
        transform .15s ease;
}

.series-item:hover {
    background: #f0e3f5;
    transform: translateX(3px);
}

.series-empty {
    padding: 18px;
    border-radius: 10px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    color: #7a5600;
}

/* =========================================================
   OPEN BUTTON
========================================================= */

.open-btn {
    width: 100%;
    padding: 12px 14px;
    margin-top: 18px;
    border: none;
    border-radius: 9px;
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );
    color: white;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition:
        transform .15s ease,
        opacity .15s ease;
}

.open-btn:hover {
    transform: scale(1.02);
    opacity: .92;
}

/* =========================================================
   PDF
========================================================= */

.pdf-card {
    min-height: 190px;
}

.pdf-card::before {
    background:
        linear-gradient(
            90deg,
            #b71c1c,
            #ef5350
        );
}

.pdf-button {
    background:
        linear-gradient(
            135deg,
            #c62828,
            #ef5350
        );
}

/* =========================================================
   EMPTY
========================================================= */

.empty-card {
    grid-column: 1 / -1;
    padding: 30px;
    text-align: center;
    border-radius: 15px;
    background: #fff8e1;
    border: 1px solid #ffe082;
}

.empty-card h3 {
    margin: 0 0 8px;
    color: #7a5600;
}

.empty-card p {
    margin: 0;
    color: #8b6a20;
}

/* =========================================================
   SIDEBAR
========================================================= */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.48);
    z-index: 9998;
}

.sidebar {
    position: fixed;
    top: 0;
    right: -310px;
    width: 290px;
    height: 100vh;
    background: white;
    z-index: 9999;
    box-shadow:
        -8px 0 25px
        rgba(0,0,0,.18);
    padding: 20px;
    transition: right .3s ease;
    overflow-y: auto;
}

.sidebar.active {
    right: 0;
}

.close-btn {
    float: right;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 9px;
    background: #edf2f7;
    font-size: 20px;
    cursor: pointer;
}

.sidebar-links {
    clear: both;
    padding-top: 35px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.sidebar-links a,
.dropdown-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: white;
    text-align: left;
    text-decoration: none;
    color: #253444;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
}

.sidebar-links a:hover,
.dropdown-btn:hover {
    background: #edf6ff;
    color: var(--primary-dark);
}

.dropdown-container {
    display: none;
    padding-left: 12px;
    border-left: 3px solid var(--secondary);
}

.dropdown-container a {
    font-size: 14px;
    font-weight: 600;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    margin-top: 30px;
    padding: 30px 20px;
    text-align: center;
    background: #102a43;
    color: #dcecff;
}

footer strong {
    color: white;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .main-container {
        padding: 18px 14px 45px;
    }

    .page-hero {
        padding: 25px 20px;
        border-radius: 16px;
    }

    .page-hero h1 {
        font-size: 25px;
    }

    .selection-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .selection-card {
        min-height: 170px;
    }

    .step-header h2 {
        font-size: 22px;
    }

}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

#stepContainer {
    animation: fadeIn .25s ease;
}

</style>

<script>

/* =========================================================
   GEPAM SCIENCE HUB
   PAST PAPERS ENGINE
========================================================= */


/* =========================================================
   STATE
========================================================= */

let currentState = {

    level: "forms",

    form: null,

    subject: null,

    category: null,

    organization: null,

    series: null,

    type: null,

    region: null,

    school: null,

    year: null

};


/* =========================================================
   ELEMENTS
========================================================= */

const stepContainer =
    document.getElementById("stepContainer");

const breadcrumb =
    document.getElementById("breadcrumb");

const backButton =
    document.getElementById("backButton");

const dataStatus =
    document.getElementById("dataStatus");


/* =========================================================
   FORMS
========================================================= */

const forms = [

    {
        id: "form1",
        name: "Form 1"
    },

    {
        id: "form2",
        name: "Form 2"
    },

    {
        id: "form3",
        name: "Form 3"
    },

    {
        id: "form4",
        name: "Form 4"
    },

    {
        id: "form5",
        name: "Form 5"
    },

    {
        id: "form6",
        name: "Form 6"
    }

];


/* =========================================================
   SUBJECTS
========================================================= */

const subjects = [

    {
        id: "physics",
        name: "Physics",
        className: "physics-card"
    },

    {
        id: "chemistry",
        name: "Chemistry",
        className: "chemistry-card"
    }

];


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value) {

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g, "_");

}


/* =========================================================
   GET DATA
========================================================= */

function getPapers() {

    return Array.isArray(window.pastPapers)
        ? window.pastPapers
        : [];

}


/* =========================================================
   FLEXIBLE FIELD READER
========================================================= */

function getField(
    paper,
    names
) {

    for (
        const name of names
    ) {

        if (
            paper &&
            paper[name] !== undefined &&
            paper[name] !== null &&
            String(paper[name]).trim() !== ""
        ) {

            return paper[name];

        }

    }

    return "";

}


/* =========================================================
   ORGANIZATION NAME
========================================================= */

function getOrganization(
    paper
) {

    return getField(
        paper,
        [
            "organization",
            "organisation",
            "examOrganization",
            "examOrganisation",
            "seriesOrganization",
            "seriesOrganisation",
            "examSeries",
            "seriesGroup",
            "seriesProvider"
        ]
    );

}


/* =========================================================
   SERIES NAME
========================================================= */

function getSeries(
    paper
) {

    return getField(
        paper,
        [
            "series",
            "seriesName",
            "series_name",
            "examSeriesName",
            "seriesTitle",
            "seriesNumber"
        ]
    );

}


/* =========================================================
   CATEGORY
========================================================= */

function getCategory(
    paper
) {

    return normalize(
        getField(
            paper,
            [
                "category",
                "paperCategory",
                "examCategory"
            ]
        )
    );

}


/* =========================================================
   SCHOOL
========================================================= */

function getSchool(
    paper
) {

    return getField(
        paper,
        [
            "school",
            "schoolName",
            "school_name",
            "institution"
        ]
    );

}


/* =========================================================
   FORM MATCH
========================================================= */

function matchesForm(
    paper
) {

    return (
        normalize(
            getField(
                paper,
                ["form", "level", "class"]
            )
        )
        ===
        normalize(currentState.form)
    );

}


/* =========================================================
   SUBJECT MATCH
========================================================= */

function matchesSubject(
    paper
) {

    return (
        normalize(
            getField(
                paper,
                ["subject"]
            )
        )
        ===
        normalize(currentState.subject)
    );

}


/* =========================================================
   CHECK DATA FILE
========================================================= */

function checkDataFile() {

    if (
        !Array.isArray(window.pastPapers)
    ) {

        dataStatus.className =
            "data-status error";

        dataStatus.innerHTML = `
            <strong>Past Papers database
            haijapakiwa.</strong><br><br>

            Hakikisha faili
            <strong>pastpapers-data.js</strong>
            lipo kwenye folder moja na
            <strong>pastpapers.html</strong>.
        `;

        return false;

    }

    dataStatus.className =
        "data-status";

    dataStatus.innerHTML = "";

    return true;

}


/* =========================================================
   RENDER FORMS
========================================================= */

function renderForms() {

    currentState = {

        level: "forms",

        form: null,

        subject: null,

        category: null,

        organization: null,

        series: null,

        type: null,

        region: null,

        school: null,

        year: null

    };

    updateBreadcrumb();

    backButton.style.display = "none";


    let html = `

        <div class="step-header">

            <span class="step-number">
                STEP 1
            </span>

            <h2>
                Chagua Kidato
            </h2>

            <p>
                Chagua kidato unachotaka
                kupata Past Papers.
            </p>

        </div>

        <div class="selection-grid">

    `;


    forms.forEach(
        form => {

            html += `

                <div class="
                    selection-card
                    form-card
                ">

                    <div>

                        <h3>
                            ${form.name}
                        </h3>

                        <p>
                            Physics & Chemistry
                            Past Papers
                        </p>

                    </div>

                    <button
                        class="open-btn"
                        onclick="
                            openForm(
                                '${form.id}'
                            )
                        ">

                        FUNGUA
                        ${form.name.toUpperCase()}

                    </button>

                </div>

            `;

        }
    );


    html += `
        </div>
    `;


    stepContainer.innerHTML =
        html;

}


/* =========================================================
   OPEN FORM
========================================================= */

function openForm(
    formId
) {

    currentState.level =
        "subjects";

    currentState.form =
        formId;

    currentState.subject =
        null;

    currentState.category =
        null;

    currentState.organization =
        null;

    currentState.series =
        null;

    currentState.type =
        null;

    currentState.region =
        null;

    currentState.school =
        null;

    currentState.year =
        null;

    pushNavigationState();

    renderSubjects();

}


/* =========================================================
   RENDER SUBJECTS
========================================================= */

function renderSubjects() {

    const form =
        forms.find(
            item =>
                item.id ===
                currentState.form
        );


    if (!form) {

        renderForms();

        return;

    }


    updateBreadcrumb();

    backButton.style.display =
        "inline-flex";


    let html = `

        <div class="step-header">

            <span class="step-number">
                STEP 2
            </span>

            <h2>
                ${form.name}
            </h2>

            <p>
                Chagua somo.
            </p>

        </div>

        <div class="selection-grid">

    `;


    subjects.forEach(
        subject => {

            html += `

                <div class="
                    selection-card
                    ${subject.className}
                ">

                    <div>

                        <h3>
                            ${subject.name}
                        </h3>

                        <p>
                            ${form.name}
                            ${subject.name}
                            Past Papers
                        </p>

                    </div>

                    <button
                        class="open-btn"
                        onclick="
                            openSubject(
                                '${subject.id}'
                            )
                        ">

                        FUNGUA
                        ${subject.name.toUpperCase()}

                    </button>

                </div>

            `;

        }
    );


    html += `
        </div>
    `;


    stepContainer.innerHTML =
        html;

}


/* =========================================================
   OPEN SUBJECT
========================================================= */

function openSubject(
    subjectId
) {

    currentState.subject =
        subjectId;

    currentState.category =
        null;

    currentState.organization =
        null;

    currentState.series =
        null;

    currentState.type =
        null;

    currentState.region =
        null;

    currentState.school =
        null;

    currentState.year =
        null;


    currentState.level =
        "categories";


    pushNavigationState();

    renderCategories();

}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories() {

    updateBreadcrumb();


    const papers =
        getPapers().filter(
            paper =>

/* =========================================================
   SERIES SORTING
========================================================= */

function sortSeries(
    seriesList
) {

    return seriesList.sort(
        (a,b) => {

            const aNumber =
                extractSeriesNumber(a);

            const bNumber =
                extractSeriesNumber(b);


            if (
                aNumber !== null &&
                bNumber !== null
            ) {

                return (
                    aNumber -
                    bNumber
                );

            }


            if (
                aNumber !== null
            ) {

                return -1;

            }


            if (
                bNumber !== null
            ) {

                return 1;

            }


            return String(a)
                .localeCompare(
                    String(b)
                );

        }
    );

}


/* =========================================================
   EXTRACT SERIES NUMBER
========================================================= */

function extractSeriesNumber(
    value
) {

    const text =
        String(value ?? "")
            .toLowerCase();


    const match =
        text.match(
            /(?:series|s(?:eries)?)[\s._-]*(\d+)/
        );


    if (match) {

        return Number(
            match[1]
        );

    }


    const numeric =
        text.match(
            /(?:^|\s)(\d+)(?:\s|$)/
        );


    if (numeric) {

        return Number(
            numeric[1]
        );

    }


    return null;

}

/* =========================================================
   FORMAT SERIES NAME
========================================================= */

function formatSeriesName(
    series
) {

    const text =
        String(series ?? "")
            .trim();


    const match =
        text.match(
            /^series[\s._-]*(\d+)$/i
        );


    if (match) {

        const number =
            Number(
                match[1]
            );


        const words = [
            "",
            "One",
            "Two",
            "Three",
            "Four",
            "Five",
            "Six",
            "Seven",
            "Eight",
            "Nine",
            "Ten"
        ];


        if (
            words[number]
        ) {

            return (
                "Series " +
                words[number]
            );

        }

    }


    return text;

}

/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
) {

    return String(value ?? "")
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(value ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    const items = [
        "Past Papers"
    ];


    if (
        currentState.form
    ) {

        const form =
            forms.find(
                item =>
                    item.id ===
                    currentState.form
            );


        if (form) {

            items.push(
                form.name
            );

        }

    }


    if (
        currentState.subject
    ) {

        const subject =
            subjects.find(
                item =>
                    item.id ===
                    currentState.subject
            );


        if (subject) {

            items.push(
                subject.name
            );

        }

    }


    if (
        currentState.category ===
        "examination_series"
    ) {

        items.push(
            "Examination Series"
        );

    }


    if (
        currentState.organization
    ) {

        items.push(
            currentState.organization
        );

    }


    if (
        currentState.series
    ) {

        items.push(
            formatSeriesName(
                currentState.series
            )
        );

    }


    if (
        currentState.region
    ) {

        items.push(
            currentState.region
        );

    }


    if (
        currentState.year
    ) {

        items.push(
            currentState.year
        );

    }


    breadcrumb.innerHTML =
        items.map(
            (
                item,
                index
            ) => {

                if (
                    index === 0
                ) {

                    return `
                        <span class="
                            breadcrumb-item
                        ">
                            ${escapeHTML(
                                item
                            )}
                        </span>
                    `;

                }


                return `

                    <span class="
                        breadcrumb-separator
                    ">
                        ›
                    </span>

                    <span class="
                        breadcrumb-item
                    ">
                        ${escapeHTML(
                            item
                        )}
                    </span>

                `;

            }
        ).join("");

}


/* =========================================================
   HISTORY
========================================================= */

function pushNavigationState() {

    history.pushState(
        {
            ...currentState
        },
        "",
        window.location.href
    );

}


/* =========================================================
   BROWSER BACK
========================================================= */

window.addEventListener(
    "popstate",
    function(event) {

        if (
            event.state
        ) {

            currentState = {
                ...event.state
            };

            renderCurrentLevel();

        }
        else {

            renderForms();

        }

    }
);


/* =========================================================
   CURRENT LEVEL
========================================================= */

function renderCurrentLevel() {

    switch (
        currentState.level
    ) {

        case "forms":

            renderForms();

            break;


        case "subjects":

            renderSubjects();

            break;


        case "categories":

            renderCategories();

            break;


        case "seriesOrganizations":

            renderSeriesOrganizations();

            break;


        case "series":

            renderSeries();

            break;


        case "seriesPapers":

            renderSeriesPapers();

            break;


        case "regions":

            renderRegions();

            break;


        case "years":

            renderYears();

            break;


        case "papers":

            renderPapers();

            break;


        default:

            renderForms();

    }

}


/* =========================================================
   BACK BUTTON
========================================================= */

function goBack() {

    if (
        currentState.level ===
        "forms"
    ) {

        window.location.href =
            "index.html";

        return;

    }


    history.back();

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleMenu() {

    const sidebar =
        document.getElementById(
            "sidebarMenu"
        );


    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    sidebar.classList.toggle(
        "active"
    );


    overlay.style.display =
        sidebar.classList.contains(
            "active"
        )
        ? "block"
        : "none";

}


/* =========================================================
   SIDEBAR DROPDOWN
========================================================= */

function toggleDropdown(
    button
) {

    const container =
        button.nextElementSibling;


    if (!container) {

        return;

    }


    const open =
        container.style.display ===
        "block";


    container.style.display =
        open
        ? "none"
        : "block";

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    history.replaceState(
        {
            level: "forms",

            form: null,

            subject: null,

            category: null,

            organization: null,

            series: null,

            type: null,

            region: null,

            school: null,

            year: null

        },
        "",
        window.location.href
    );


    if (
        !checkDataFile()
    ) {

        return;

    }


    renderForms();

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
