<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Past Papers | GEPAM Science Hub
    </title>

    <meta
        name="description"
        content="GEPAM Science Hub Physics and Chemistry Past Papers from Form 1 to Form 6."
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #1f2937;
        }


        /* ==================================================
           HEADER
        ================================================== */

        header {
            background: #003366;
            color: white;
            padding: 14px 20px;
        }


        .header-inner {
            max-width: 1100px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .brand-logo {
            width: 42px;
            height: 42px;

            object-fit: contain;
            border-radius: 50%;
        }


        .brand-text {
            line-height: 1.1;
        }


        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }


        .brand-tagline {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 3px;
        }


        /* ==================================================
           MENU
        ================================================== */

        .menu-button {
            display: none;

            border: none;
            background: transparent;
            color: white;

            font-size: 28px;
            cursor: pointer;
        }


        nav {
            display: flex;
            gap: 18px;
        }


        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }


        nav a:hover {
            text-decoration: underline;
        }


        /* ==================================================
           MAIN
        ================================================== */

        main {
            max-width: 950px;
            margin: 0 auto;
            padding: 25px 16px 50px;
        }


        .page-intro {
            text-align: center;
            margin-bottom: 25px;
        }


        .page-intro h1 {
            margin: 0 0 8px;
            color: #003366;
            font-size: 30px;
        }


        .page-intro p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }


        /* ==================================================
           PAST PAPERS APP
        ================================================== */

        .pp-container {
            width: 100%;
        }


        .pp-back {
            border: none;
            background: transparent;

            color: #003366;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            padding: 8px 0;
            margin-bottom: 10px;
        }


        .pp-back:hover {
            color: #0066cc;
        }


        .pp-breadcrumb {
            font-size: 13px;
            color: #64748b;

            margin-bottom: 6px;

            min-height: 18px;
        }


        .pp-title {
            margin: 0;

            font-size: 26px;
            color: #003366;
        }


        .pp-subtitle {
            margin: 7px 0 18px;

            color: #64748b;
            line-height: 1.5;
        }


        /* ==================================================
           CHAIN
        ================================================== */

        .pp-chain {
            display: flex;
            flex-direction: column;

            border-top: 1px solid #dbe4ec;

            background: white;
        }


        /* ==================================================
           CHAIN ITEM
        ================================================== */

        .pp-chain-item {
            width: 100%;

            border: none;
            border-bottom: 1px solid #dbe4ec;

            background: white;

            padding: 18px 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.15s ease,
                padding-left 0.15s ease;
        }


        .pp-chain-item:hover {
            background: #f1f7fc;
            padding-left: 22px;
        }


        .pp-chain-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }


        .pp-chain-name {
            color: #003366;

            font-size: 17px;
            font-weight: 700;
        }


        .pp-chain-meta {
            color: #64748b;
            font-size: 13px;
        }


        .pp-arrow {
            color: #003366;
            font-size: 27px;
            line-height: 1;
        }


        /* ==================================================
           PAPER ITEM
        ================================================== */

        .pp-paper-item {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 16px;

            border-bottom: 1px solid #dbe4ec;

            background: white;

            text-decoration: none;

            transition:
                background 0.15s ease,
                padding-left 0.15s ease;
        }


        .pp-paper-item:hover {
            background: #eef7ff;
            padding-left: 22px;
        }


        .pp-paper-left {
            display: flex;
            flex-direction: column;
            gap: 5px;

            min-width: 0;
        }


        .pp-paper-title {
            color: #003366;

            font-size: 16px;
            font-weight: 700;

            line-height: 1.4;
        }


        .pp-paper-meta {
            color: #64748b;
            font-size: 13px;
        }


        .pp-pdf-arrow {
            flex-shrink: 0;

            margin-left: 15px;

            color: #0066cc;

            font-size: 14px;
            font-weight: 700;
        }


        /* ==================================================
           EMPTY
        ================================================== */

        .pp-empty {
            background: white;

            padding: 40px 20px;

            text-align: center;

            border-bottom: 1px solid #dbe4ec;
        }


        .pp-empty-icon {
            font-size: 35px;
            margin-bottom: 8px;
        }


        .pp-empty h3 {
            margin: 0 0 6px;
            color: #003366;
        }


        .pp-empty p {
            margin: 0;
            color: #64748b;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        footer {
            text-align: center;

            padding: 25px 15px;

            color: #64748b;

            font-size: 13px;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {

            header {
                padding: 12px 15px;
            }


            .header-inner {
                position: relative;
            }


            .menu-button {
                display: block;
            }


            nav {
                display: none;

                position: absolute;

                top: 55px;
                right: 0;

                width: 210px;

                background: #003366;

                padding: 15px;

                flex-direction: column;

                gap: 13px;

                border-radius: 0 0 8px 8px;

                z-index: 1000;
            }


            nav.open {
                display: flex;
            }


            .brand-name {
                font-size: 18px;
            }


            .brand-tagline {
                font-size: 11px;
            }


            main {
                padding: 20px 10px 40px;
            }


            .page-intro h1 {
                font-size: 25px;
            }


            .pp-title {
                font-size: 23px;
            }


            .pp-chain-name {
                font-size: 16px;
            }


            .pp-chain-item,
            .pp-paper-item {
                padding: 16px 12px;
            }


            .pp-chain-item:hover,
            .pp-paper-item:hover {
                padding-left: 16px;
            }


            .pp-paper-title {
                font-size: 15px;
            }


            .pp-pdf-arrow {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="header-inner">

            <div class="brand">

                <!--
                    Kama logo yako ina filename tofauti,
                    BADILISHA src tu.
                -->

                <img
                    class="brand-logo"
                    src="favicon.png"
                    alt="GEPAM Science Hub"
                >

                <div class="brand-text">

                    <div class="brand-name">
                        GEPAM Science Hub
                    </div>

                    <div class="brand-tagline">
                        Making Science Easy
                    </div>

                </div>

            </div>


            <button
                id="menuButton"
                class="menu-button"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>


            <nav id="mainNav">

                <a href="index.html">
                    Home
                </a>

                <a href="notes.html">
                    Notes
                </a>

                <a href="pastpapers.html">
                    Past Papers
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <section class="page-intro">

            <h1>
                Past Papers
            </h1>

            <p>
                Find Physics and Chemistry examination papers
                from Form 1 to Form 6.
                Follow the chain below until you reach the PDF.
            </p>

        </section>


        <!--
            IMPORTANT:
            pastpapers.js ita-render chain yote hapa.
        -->

        <section id="pastPapersApp">

            <p style="text-align:center;">
                Loading past papers...
            </p>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        © 2026 GEPAM Science Hub.
        All Rights Reserved.

    </footer>


    <!-- =====================================================
         MOBILE MENU
    ====================================================== -->

    <script>

        const menuButton =
            document.getElementById("menuButton");

        const mainNav =
            document.getElementById("mainNav");


        if (menuButton && mainNav) {

            menuButton.addEventListener(
                "click",
                () => {

                    mainNav.classList.toggle("open");

                }
            );


            mainNav.querySelectorAll("a")
                .forEach(link => {

                    link.addEventListener(
                        "click",
                        () => {

                            mainNav.classList.remove("open");

                        }
                    );

                });

        }

    </script>


    <!-- =====================================================
         DATA FIRST
    ====================================================== -->

    <script src="data.js"></script>


    <!-- =====================================================
         ENGINE SECOND
    ====================================================== -->

    <script src="pastpapers.js"></script>


</body>

</html>
