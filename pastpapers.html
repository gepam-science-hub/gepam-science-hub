<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="GEPAM Science Hub - Physics and Chemistry Past Papers">

    <title>Past Papers | GEPAM Science Hub</title>

    <!-- MAIN WEBSITE CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PAST PAPERS CSS -->
    <link rel="stylesheet" href="pastpapers.css">
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="pastpapers-header">

    <div class="pastpapers-logo">
        📚
    </div>

    <h1>GEPAM Science Hub</h1>

    <p>Physics & Chemistry Past Papers</p>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="pastpapers-page">

    <!-- HERO -->

    <section class="pastpapers-hero">

        <div>

            <span class="hero-badge">
                📚 PAST PAPERS
            </span>

            <h2>
                Past Papers
            </h2>

            <p>
                Find examination papers step by step
            </p>

        </div>

    </section>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <section class="paper-navigation">

        <!-- PROGRESS -->

        <div id="progressWrapper"
             class="progress-wrapper">

        </div>


        <!-- BREADCRUMB -->

        <div id="selectionBreadcrumb"
             class="selection-breadcrumb">

            <span>Past Papers</span>

        </div>


        <!-- CONTENT -->

        <div class="paper-content">

            <div id="paperApp">

                <!-- JavaScript will generate
                     the complete system here -->

                <div class="empty-state">

                    <div class="empty-icon">
                        📚
                    </div>

                    <h3>
                        Loading Past Papers...
                    </h3>

                    <p>
                        Tafadhali subiri kidogo.
                    </p>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="copyright">

        © 2026 GEPAM Science Hub —
        Physics & Chemistry Learning Resources

    </div>

</footer>


<!-- =====================================================
     JAVASCRIPT
     
     MUHIMU:
     data.js LAZIMA IJE KWANZA
     pastpapers.js IJE BAADA YA DATA.JS
===================================================== -->

<script src="data.js" defer></script>

<script src="pastpapers.js" defer></script>

</body>
</html>
