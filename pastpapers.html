<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEPAM Science Hub - Past Papers</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Inaita faili lako la pastpapers.css -->
    <link rel="stylesheet" href="pastpapers.css">
</head>
<body>

<!-- Fixed Navbar Menu -->
<nav class="navbar">
    <div style="display: flex; align-items: center; gap: 20px;">
        <span class="back-nav-btn" onclick="goBackOrHome()">← Rudi</span>
        <a href="#" class="nav-brand">🧬 GEPAM Hub</a>
    </div>
    <div class="nav-links">
        <a href="premium-notes.html" class="nav-btn">Premium Notes ⭐</a>
    </div>
</nav>

<div class="container">
    <header>
        <h1>GEPAM Science Hub</h1>
        <p>Fuata hatua kupata mitihani yako ya nyuma</p>
    </header>

    <!-- Hatua ya 1: Vidato vyote 1 hadi 6 -->
    <div class="step-section" id="step1">
        <p class="step-title">Hatua ya 1: Chagua Kidato</p>
        <div class="options-grid" id="formOptions">
            <div class="opt-btn" onclick="handleFormSelect('form1')">Form 1</div>
            <div class="opt-btn" onclick="handleFormSelect('form2')">Form 2</div>
            <div class="opt-btn" onclick="handleFormSelect('form3')">Form 3</div>
            <div class="opt-btn" onclick="handleFormSelect('form4')">Form 4</div>
            <div class="opt-btn" onclick="handleFormSelect('form5')">Form 5</div>
            <div class="opt-btn" onclick="handleFormSelect('form6')">Form 6</div>
        </div>
    </div>

    <!-- Hatua ya 2: Masomo -->
    <div class="step-section hidden" id="step2">
        <p class="step-title">Hatua ya 2: Chagua Somo</p>
        <div class="options-grid" id="subjectOptions"></div>
    </div>

    <!-- Hatua ya 3: Aina za Mitihani -->
    <div class="step-section hidden" id="step3">
        <p class="step-title">Hatua ya 3: Chagua Aina ya Mtihani</p>
        <div class="options-grid" id="typeOptions"></div>
    </div>

    <!-- Hatua ya 4: Mkoa au Shule kutegemea Kidato -->
    <div class="step-section hidden" id="step4">
        <p class="step-title" id="locationLabel">Hatua ya 4: Chagua Shule/Mkoa</p>
        <div class="options-grid" id="locationOptions"></div>
    </div>

    <!-- Hatua ya 5: Mwaka -->
    <div class="step-section hidden" id="step5">
        <p class="step-title">Hatua ya 5: Chagua Mwaka</p>
        <div class="options-grid" id="yearOptions"></div>
    </div>

    <!-- Orodha ya PDF ya Mwisho -->
    <div class="papers-grid" id="finalPapersArea"></div>
</div>

<!-- Viunganishi vya majina uliyoyaelekeza -->
<script src="pastpapers.data.js"></script>
<script src="pastpapers.js"></script>
</body>
</html>
