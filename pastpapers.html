<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Past Papers | GEPAM Science Hub</title>

    <meta name="description"
          content="Physics and Chemistry past papers for Form 1 to Form 6 students in Tanzania.">

    <link rel="stylesheet" href="style.css">

    <style>
        .pastpapers-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 15px 60px;
        }

        .pastpapers-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .pastpapers-header h1 {
            color: #003366;
            margin-bottom: 8px;
        }

        .pastpapers-header p {
            color: #555;
        }

        .paper-navigation {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            background: #f1f6fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .breadcrumb span {
            color: #555;
        }

        .breadcrumb .active {
            color: #003366;
            font-weight: bold;
        }

        .step-title {
            text-align: center;
            color: #003366;
            margin-bottom: 20px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .choice-card {
            border: none;
            background: #f8fbfd;
            border: 2px solid #e1eaf0;
            border-radius: 10px;
            padding: 20px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 16px;
            color: #003366;
            font-weight: bold;
        }

        .choice-card:hover {
            border-color: #003366;
            background: #eef6fb;
            transform: translateY(-2px);
        }

        .choice-icon {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .paper-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .paper-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border: 1px solid #e0e7ec;
            border-radius: 10px;
            padding: 16px;
            background: #fff;
        }

        .paper-info h3 {
            margin: 0 0 7px;
            color: #003366;
            font-size: 17px;
        }

        .paper-info p {
            margin: 3px 0;
            color: #666;
            font-size: 14px;
        }

        .open-pdf {
            display: inline-block;
            background: #003366;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            white-space: nowrap;
            font-weight: bold;
        }

        .open-pdf:hover {
            background: #00509e;
        }

        .back-button {
            border: none;
            background: #eef3f7;
            color: #003366;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .back-button:hover {
            background: #dce8f0;
        }

        .home-button {
            display: inline-block;
            margin-top: 25px;
            background: #003366;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 7px;
        }

        .empty-message {
            text-align: center;
            padding: 35px 15px;
            color: #777;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .error-message {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            color: #a00000;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .paper-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .open-pdf {
                width: 100%;
                text-align: center;
            }

            .paper-navigation {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="notes.html">Notes</a>
            <a href="pastpapers.html" class="active">Past Papers</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="pastpapers-page">

        <div class="pastpapers-header">
            <h1>📚 GEPAM Science Hub</h1>
            <p>Physics & Chemistry Past Papers</p>
        </div>

        <section class="paper-navigation">

            <!-- BREADCRUMB -->
            <div id="breadcrumb" class="breadcrumb"></div>

            <!-- CONTENT WILL BE GENERATED BY pastpapers.js -->
            <div id="pastPaperContent"></div>

        </section>

        <div style="text-align:center;">
            <a href="index.html" class="home-button">
                🏠 Back to Home
            </a>
        </div>

    </main>

    <!-- IMPORTANT:
         data.js MUST come BEFORE pastpapers.js
    -->

    <script src="data.js"></script>
    <script src="pastpapers.js"></script>

</body>
</html>
