<style>

/* =========================================================
   GEPAM PAST PAPERS
   DIFFERENT COLOUR THEME FROM NOTES
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #172033;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.nav-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    max-width: 1050px;

    margin: 0 auto;

    padding: 14px 20px;

    background: #ffffff;

    border-bottom: 1px solid #dfe6f1;

}

.logo-area {

    display: flex;

    align-items: center;

    gap: 10px;

}

.logo-area img {

    height: 42px;

    width: auto;

}

.logo-title {

    font-weight: bold;

    font-size: 18px;

    color: #16213e;

}

.menu-toggle {

    border: none;

    background: #eef3ff;

    color: #243b75;

    width: 44px;

    height: 44px;

    border-radius: 10px;

    font-size: 25px;

    cursor: pointer;

}

.menu-toggle:hover {

    background: #dfe8ff;

}


/* =========================================================
   MAIN
========================================================= */

.main-container {

    max-width: 1050px;

    margin: 0 auto;

    padding: 28px 20px 60px;

}


/* =========================================================
   HERO
========================================================= */

.page-header {

    text-align: center;

    margin-bottom: 25px;

}

.page-header .main-icon {

    font-size: 48px;

    margin-bottom: 5px;

}

.page-header h1 {

    margin: 5px 0 8px;

    font-size: 30px;

    color: #172554;

}

.page-header p {

    margin: 0 auto;

    max-width: 650px;

    color: #667085;

    line-height: 1.6;

}


/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 20px;

    padding: 12px 15px;

    background: #ffffff;

    border-left: 4px solid #5b4bdb;

    border-radius: 8px;

    box-shadow:
        0 3px 10px rgba(24, 39, 75, 0.06);

    font-size: 14px;

}

.breadcrumb span {

    font-weight: bold;

    color: #344054;

}

.breadcrumb .separator {

    color: #98a2b3;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    padding: 11px 18px;

    margin-bottom: 20px;

    border: none;

    border-radius: 8px;

    background: #273c75;

    color: white;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

}

.back-btn:hover {

    background: #1d2d5c;

}


/* =========================================================
   STEP
========================================================= */

.step-title {

    text-align: center;

    margin: 15px 0 22px;

}

.step-number {

    display: inline-block;

    padding: 5px 10px;

    margin-bottom: 8px;

    background: #e9e5ff;

    color: #5b4bdb;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}

.step-title h2 {

    margin: 5px 0 8px;

    color: #172554;

    font-size: 25px;

}

.step-title p {

    margin: 0;

    color: #667085;

}


/* =========================================================
   GRID
========================================================= */

.selection-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 18px;

}


/* =========================================================
   CARD
========================================================= */

.selection-card {

    position: relative;

    background: #ffffff;

    border: 1px solid #dce3ef;

    border-radius: 13px;

    padding: 22px;

    min-height: 155px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    box-shadow:
        0 5px 15px rgba(24, 39, 75, 0.07);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

    overflow: hidden;

}

.selection-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 5px;

    background: #5b4bdb;

}

.selection-card:hover {

    transform: translateY(-4px);

    border-color: #b9b0f5;

    box-shadow:
        0 10px 25px rgba(24, 39, 75, 0.12);

}

.selection-card h3 {

    margin: 4px 0 9px;

    color: #172554;

    font-size: 19px;

}

.selection-card p {

    margin: 0;

    color: #667085;

    font-size: 14px;

    line-height: 1.55;

}


/* =========================================================
   FORM CARDS
========================================================= */

.form-card {

    min-height: 165px;

}

.form-icon {

    font-size: 38px;

    margin-bottom: 5px;

}


/* =========================================================
   SUBJECT CARDS
========================================================= */

.subject-card {

    min-height: 180px;

}

.subject-icon {

    font-size: 40px;

    margin-bottom: 5px;

}


/* =========================================================
   TYPE CARDS
========================================================= */

.type-card {

    min-height: 165px;

}

.type-icon {

    font-size: 35px;

    margin-bottom: 5px;

}


/* =========================================================
   REGION CARDS
========================================================= */

.region-card {

    min-height: 150px;

}

.region-icon {

    font-size: 32px;

    margin-bottom: 5px;

}


/* =========================================================
   YEAR CARDS
========================================================= */

.year-card {

    min-height: 145px;

}

.year-number {

    font-size: 35px;

    font-weight: bold;

    color: #5b4bdb;

    margin-bottom: 5px;

}


/* =========================================================
   PAPER CARD
========================================================= */

.paper-card {

    min-height: 190px;

}

.paper-icon {

    font-size: 36px;

    margin-bottom: 7px;

}

.paper-title {

    color: #172554;

    font-size: 18px;

    font-weight: bold;

    line-height: 1.4;

}


/* =========================================================
   OPEN BUTTON
========================================================= */

.open-btn {

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    border: none;

    border-radius: 8px;

    background: #5b4bdb;

    color: #ffffff;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    transition: background .2s ease;

}

.open-btn:hover {

    background: #4938bd;

}


/* =========================================================
   PDF BUTTON
========================================================= */

.pdf-btn {

    width: 100%;

    padding: 13px;

    margin-top: 15px;

    border: none;

    border-radius: 8px;

    background: #e85d04;

    color: white;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

}

.pdf-btn:hover {

    background: #c94d00;

}


/* =========================================================
   DIFFERENT TYPE COLOURS
========================================================= */

.type-acsee::before {

    background: #e85d04;

}

.type-necta::before {

    background: #2563eb;

}

.type-mock::before {

    background: #7c3aed;

}

.type-pre::before {

    background: #0891b2;

}

.type-joint::before {

    background: #db2777;

}

.type-midterm::before {

    background: #16a34a;

}

.type-terminal::before {

    background: #ca8a04;

}

.type-annual::before {

    background: #dc2626;

}

.type-ftna::before {

    background: #0f766e;

}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.message-card {

    background: #ffffff;

    border: 1px solid #dce3ef;

    border-radius: 13px;

    padding: 30px 22px;

    text-align: center;

    box-shadow:
        0 5px 15px rgba(24,39,75,.07);

}

.message-icon {

    font-size: 45px;

    margin-bottom: 10px;

}

.message-card h3 {

    color: #172554;

    margin: 5px 0 10px;

}

.message-card p {

    color: #667085;

    line-height: 1.6;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    top: 0;

    right: -300px;

    width: 285px;

    height: 100%;

    background: #ffffff;

    box-shadow:
        -8px 0 25px rgba(0,0,0,.15);

    transition: right .3s ease;

    z-index: 10000;

    padding: 20px;

    overflow-y: auto;

}

.sidebar.active {

    right: 0;

}

.close-btn {

    float: right;

    border: none;

    background: #eef3ff;

    color: #273c75;

    border-radius: 8px;

    font-size: 22px;

    width: 40px;

    height: 40px;

    cursor: pointer;

}

.sidebar-links {

    margin-top: 58px;

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.sidebar-links a,
.dropdown-btn {

    display: block;

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #344054;

    text-decoration: none;

    font-weight: bold;

    text-align: left;

    cursor: pointer;

    font-size: 15px;

}

.sidebar-links a:hover,
.dropdown-btn:hover {

    background: #eef3ff;

    color: #4c3cc6;

}

.dropdown-container {

    display: none;

    padding-left: 10px;

    border-left: 3px solid #5b4bdb;

}

.dropdown-container a {

    font-size: 14px;

    font-weight: normal;

}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(12, 20, 40, .48);

    z-index: 9999;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    margin-top: 35px;

    padding: 30px 20px;

    text-align: center;

    background: #172554;

    color: white;

}

footer strong {

    color: #d9d4ff;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .main-container {

        padding: 22px 15px 50px;

    }

    .page-header h1 {

        font-size: 25px;

    }

    .page-header .main-icon {

        font-size: 42px;

    }

    .selection-grid {

        grid-template-columns: 1fr;

    }

    .selection-card {

        min-height: 150px;

    }

    .breadcrumb {

        font-size: 13px;

    }

}

</style>

</head>
