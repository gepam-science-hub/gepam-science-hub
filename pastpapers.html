<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GEPAM Science Hub | Past Papers</title>

    <link rel="icon"
          type="image/png"
          href="file_00000000f17471f4b8f76a744122207a.png">

    <!-- TUNATUMIA STYLE.CSS YAKO ILIYOPO -->
    <link rel="stylesheet"
          href="style.css">

    <!-- Past Papers CSS maalum -->
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #222;
        }

        /* ==============================
           HEADER
        ============================== */

        .pp-header {
            background: #14213d;
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            margin: auto;
        }

        .pp-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pp-brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .pp-brand-text strong {
            display: block;
            font-size: 18px;
        }

        .pp-brand-text span {
            font-size: 13px;
            opacity: .8;
        }

        .pp-menu {
            border: 0;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }


        /* ==============================
           MAIN
        ============================== */

        .pp-main {
            max-width: 1000px;
            margin: auto;
            padding: 25px 20px 60px;
        }

        .pp-hero {
            text-align: center;
            margin-bottom: 25px;
        }

        .pp-hero-icon {
            font-size: 42px;
        }

        .pp-hero h1 {
            margin: 8px 0;
            font-size: 29px;
            color: #14213d;
        }

        .pp-hero p {
            color: #666;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 650px;
        }


        /* ==============================
           BREADCRUMB
        ============================== */

        .pp-breadcrumb {
            background: white;
            border-left: 5px solid #f28c28;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 7px;
            box-shadow: 0 3px 10px rgba(0,0,0,.05);
            font-size: 14px;
        }

        .pp-breadcrumb span {
            font-weight: bold;
            color: #14213d;
        }

        .pp-breadcrumb .arrow {
            color: #f28c28;
            margin: 0 5px;
        }


        /* ==============================
           BACK BUTTON
        ============================== */

        .pp-back {
            display: none;
            border: 0;
            background: #14213d;
            color: white;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .pp-back:hover {
            background: #0b172f;
        }


        /* ==============================
           STEP
        ============================== */

        .pp-step {
            text-align: center;
            margin-bottom: 20px;
        }

        .pp-step-number {
            display: inline-flex;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f28c28;
            color: white;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .pp-step h2 {
            margin: 5px 0;
            color: #14213d;
        }

        .pp-step p {
            color: #666;
            margin: 5px 0;
        }


        /* ==============================
           CARDS
        ============================== */

        .pp-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .pp-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            min-height: 155px;

            border: 1px solid #e2e6eb;
            border-top: 5px solid #f28c28;

            box-shadow:
                0 5px 15px rgba(0,0,0,.06);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .pp-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 9px 20px rgba(0,0,0,.10);
        }

        .pp-card-icon {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .pp-card h3 {
            margin: 5px 0 8px;
            color: #14213d;
        }

        .pp-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }


        /* ==============================
           OPEN BUTTON
        ============================== */

        .pp-open {
            width: 100%;
            margin-top: 15px;
            padding: 12px;

            border: 0;
            border-radius: 7px;

            background: #f28c28;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .pp-open:hover {
            background: #d96f0b;
        }


        /* ==============================
           PDF CARD
        ============================== */

        .pp-pdf {
            border-top-color: #198754;
        }

        .pp-pdf .pp-open {
            background: #198754;
        }

        .pp-pdf .pp-open:hover {
            background: #146c43;
        }


        /* ==============================
           EMPTY
        ============================== */

        .pp-empty {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            color: #666;
            border: 1px solid #ddd;
        }


        /* ==============================
           ERROR
        ============================== */

        .pp-error {
            background: #fff3cd;
            border: 1px solid #ffda6a;
            color: #664d03;
            padding: 18px;
            border-radius: 10px;
            line-height: 1.6;
        }


        /* ==============================
           SIDEBAR
        ============================== */

        .pp-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 9998;
        }

        .pp-sidebar {
            position: fixed;
            top: 0;
            right: -290px;

            width: 280px;
            height: 100%;

            background: white;

            z-index: 9999;

            padding: 20px;

            box-shadow:
                -5px 0 20px rgba(0,0,0,.15);

            transition: right .3s ease;
        }

        .pp-sidebar.active {
            right: 0;
        }

        .pp-close {
            float: right;
            border: 0;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .pp-links {
            clear: both;
            padding-top: 50px;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pp-links a {
            text-decoration: none;
            color: #14213d;
            font-weight: bold;
            padding: 12px;
            border-radius: 7px;
        }

        .pp-links a:hover {
            background: #fff1e3;
            color: #d96f0b;
        }


        /* ==============================
           FOOTER
        ============================== */

        .pp-footer {
            max-width: 1000px;
            margin: 20px auto 0;

            background: #14213d;
            color: white;

            text-align: center;

            padding: 25px 15px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .pp-main {
                padding: 20px 15px 45px;
            }

            .pp-hero h1 {
                font-size: 24px;
            }

            .pp-grid {
                grid-template-columns: 1fr;
            }

            .pp-card {
                min-height: 140px;
            }

        }

    </style>

</head>

<!-- =====================================================

<script>

function ppToggleMenu() {

    const sidebar =
        document.getElementById("ppSidebar");

    const overlay =
        document.getElementById("ppOverlay");

    sidebar.classList.toggle("active");

    overlay.style.display =
        sidebar.classList.contains("active")
        ? "block"
        : "none";

}

</script>
