<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    background: #fafafa;

    color: #222;

    overflow-x: hidden;
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.nav-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    max-width: 1000px;

    margin: 0 auto;

    padding: 15px 20px;

    background: #fff;

    border-bottom: 1px solid #eee;
}


.logo-area {

    display: flex;

    align-items: center;

    gap: 10px;
}


.logo-area img {

    height: 40px;

    width: auto;
}


.logo-title {

    font-weight: bold;

    font-size: 18px;

    color: #222;
}


.menu-toggle {

    font-size: 28px;

    background: none;

    border: none;

    cursor: pointer;

    color: #333;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    top: 0;

    right: -290px;

    width: 280px;

    height: 100%;

    background: #fff;

    box-shadow:
        -5px 0 15px rgba(0,0,0,0.12);

    transition: right 0.3s ease;

    z-index: 10000;

    padding: 20px;

    overflow-y: auto;
}


.sidebar.active {

    right: 0;
}


.close-btn {

    font-size: 24px;

    background: none;

    border: none;

    cursor: pointer;

    color: #333;

    float: right;

    padding: 5px 10px;
}


.sidebar-links {

    margin-top: 55px;

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.sidebar-links a {

    display: block;

    width: 100%;

    padding: 12px;

    text-decoration: none;

    color: #333;

    font-weight: bold;

    font-size: 16px;

    border-radius: 5px;
}


.sidebar-links a:hover {

    background: #f4f4f4;

    color: #00a500;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    display: none;

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    background: rgba(0,0,0,0.45);

    z-index: 9999;
}


/* =========================================================
   MAIN
========================================================= */

.main-container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 25px 20px 60px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header {

    text-align: center;

    margin-bottom: 25px;
}


.page-header h1 {

    margin-bottom: 8px;

    font-size: 28px;
}


.page-header p {

    color: #666;

    line-height: 1.6;
}


/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 6px;

    margin-bottom: 20px;

    font-size: 14px;

    color: #666;
}


.breadcrumb span {

    font-weight: bold;

    color: #333;
}


.breadcrumb .separator {

    color: #aaa;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 11px 18px;

    background: #333;

    color: #fff;

    border: none;

    border-radius: 6px;

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 20px;

    text-decoration: none;
}


.back-btn:hover {

    background: #222;
}


/* =========================================================
   STEP TITLE
========================================================= */

.step-title {

    text-align: center;

    margin: 20px 0;
}


.step-title h2 {

    margin-bottom: 8px;

    font-size: 24px;
}


.step-title p {

    color: #666;
}


/* =========================================================
   SELECTION GRID
========================================================= */

.selection-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 18px;

    margin-top: 20px;
}


/* =========================================================
   SELECTION CARD
========================================================= */

.selection-card {

    background: #fff;

    border: 1px solid #e5e5e5;

    border-top: 5px solid #00c300;

    border-radius: 9px;

    padding: 22px;

    min-height: 150px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.05);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.selection-card:hover {

    transform: translateY(-3px);

    box-shadow:
        0 7px 15px rgba(0,0,0,0.08);
}


.selection-card h3 {

    margin-top: 0;

    font-size: 19px;
}


.selection-card p {

    color: #666;

    line-height: 1.5;

    font-size: 14px;
}


/* =========================================================
   CARD ICON
========================================================= */

.card-icon {

    font-size: 34px;

    margin-bottom: 8px;
}


/* =========================================================
   OPEN BUTTON
========================================================= */

.open-btn {

    width: 100%;

    padding: 12px;

    background: #00c300;

    color: #fff;

    border: none;

    border-radius: 5px;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    margin-top: 15px;
}


.open-btn:hover {

    background: #00a500;
}


/* =========================================================
   PAPER CARD
========================================================= */

.paper-card {

    border-top-color: #007bff;
}


.paper-card:hover {

    border-top-color: #0056b3;
}


/* =========================================================
   PDF BUTTON
========================================================= */

.pdf-btn {

    display: block;

    width: 100%;

    padding: 12px;

    background: #007bff;

    color: #fff;

    text-align: center;

    text-decoration: none;

    border-radius: 5px;

    font-weight: bold;

    font-size: 14px;

    margin-top: 15px;
}


.pdf-btn:hover {

    background: #0056b3;
}


/* =========================================================
   YEAR CARD
========================================================= */

.year-card {

    border-top-color: #ff9800;
}


.year-card:hover {

    border-top-color: #e68900;
}


/* =========================================================
   REGION CARD
========================================================= */

.region-card {

    border-top-color: #00a500;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-card {

    text-align: center;

    border-top-color: #777;
}


.empty-card h3 {

    color: #555;
}


/* =========================================================
   FOOTER
========================================================= */

.site-footer {

    text-align: center;

    padding: 30px;

    background: #222;

    color: #fff;

    margin-top: 40px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .main-container {

        padding:
            20px
            15px
            50px;
    }


    .page-header h1 {

        font-size: 24px;
    }


    .step-title h2 {

        font-size: 21px;
    }


    .selection-grid {

        grid-template-columns: 1fr;
    }


    .selection-card {

        min-height: 145px;
    }

}

</style>

<script>

/*
=============================================================
 GEPAM SCIENCE HUB
 PAST PAPERS NAVIGATION

 STRUCTURE:

 FORM
   ↓
 SUBJECT
   ↓
 TYPE
   ↓
 REGION
   ↓
 YEAR
   ↓
 PDF


 NO OLD / NEW SYLLABUS
=============================================================
*/


/* =========================================================
   STATE
========================================================= */

let currentState = {

    level: "forms",

    form: null,

    subject: null,

    type: null,

    region: null,

    year: null

};


/* =========================================================
   ELEMENTS
========================================================= */

const container =
    document.getElementById(
        "stepContainer"
    );


const breadcrumb =
    document.getElementById(
        "breadcrumb"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


/* =========================================================
   NORMALIZE DATA
========================================================= */

function getPastPaperDatabase() {

    /*
    ---------------------------------------------------------
    Tunatumia window.pastPapers kutoka
    pastpapers.data.js
    ---------------------------------------------------------
    */

    if (
        window.pastPapers &&
        typeof window.pastPapers === "object"
    ) {

        return window.pastPapers;

    }


    return {};

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    currentState = {

        level: "forms",

        form: null,

        subject: null,

        type: null,

        region: null,

        year: null

    };


    renderForms();

}


/* =========================================================
   RENDER FORMS
========================================================= */

function renderForms() {

    currentState.level =
        "forms";


    currentState.form =
        null;

    currentState.subject =
        null;

    currentState.type =
        null;

    currentState.region =
        null;

    currentState.year =
        null;


    updateBreadcrumb();


    backButton.style.display =
        "none";


    let html = `

        <div class="step-title">

            <h2>
                🎓 Chagua Kidato
            </h2>

            <p>
                Chagua kidato unachotaka
                kupata past papers.
            </p>

        </div>


        <div class="selection-grid">

    `;


    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        html += `

            <div class="selection-card">

                <div>

                    <div class="card-icon">
                        📚
                    </div>

                    <h3>
                        Form ${i}
                    </h3>

                    <p>
                        Physics & Chemistry
                        Past Papers
                    </p>

                </div>


                <button
                    class="open-btn"
                    onclick="openForm('form${i}')">

                    FUNGUA FORM ${i}

                </button>

            </div>

        `;

    }


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN FORM
========================================================= */

function openForm(form) {

    currentState.level =
        "subjects";

    currentState.form =
        form;

    currentState.subject =
        null;

    currentState.type =
        null;

    currentState.region =
        null;

    currentState.year =
        null;


    renderSubjects();

}


/* =========================================================
   RENDER SUBJECTS
========================================================= */

function renderSubjects() {

    updateBreadcrumb();


    backButton.style.display =
        "inline-flex";


    let html = `

        <div class="step-title">

            <h2>
                📚 ${formatForm(
                    currentState.form
                )}
            </h2>

            <p>
                Chagua subject.
            </p>

        </div>


        <div class="selection-grid">

    `;


    html += `

        <div class="selection-card">

            <div>

                <div class="card-icon">
                    ⚛️
                </div>

                <h3>
                    Physics
                </h3>

                <p>
                    Physics examination
                    papers.
                </p>

            </div>


            <button
                class="open-btn"
                onclick="openSubject('physics')">

                FUNGUA PHYSICS

            </button>

        </div>


        <div class="selection-card">

            <div>

                <div class="card-icon">
                    🧪
                </div>

                <h3>
                    Chemistry
                </h3>

                <p>
                    Chemistry examination
                    papers.
                </p>

            </div>


            <button
                class="open-btn"
                onclick="openSubject('chemistry')">

                FUNGUA CHEMISTRY

            </button>

        </div>

    `;


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN SUBJECT
========================================================= */

function openSubject(subject) {

    currentState.level =
        "types";

    currentState.subject =
        subject;

    currentState.type =
        null;

    currentState.region =
        null;

    currentState.year =
        null;


    renderTypes();

}


/* =========================================================
   GET PAPERS
========================================================= */

function getCurrentPapers() {

    const db =
        getPastPaperDatabase();


    const formData =
        db[
            currentState.form
        ];


    if (!formData) {

        return [];

    }


    const subjectData =
        formData[
            currentState.subject
        ];


    if (!Array.isArray(subjectData)) {

        return [];

    }


    return subjectData;

}


/* =========================================================
   RENDER TYPES
========================================================= */

function renderTypes() {

    updateBreadcrumb();


    const papers =
        getCurrentPapers();


    const types =
        [...new Set(

            papers

                .map(
                    paper =>
                        paper.type
                )

                .filter(Boolean)

        )];


    let html = `

        <div class="step-title">

            <h2>
                📝 Exam Type
            </h2>

            <p>
                Chagua aina ya mtihani.
            </p>

        </div>


        <div class="selection-grid">

    `;


    if (
        types.length === 0
    ) {

        html += emptyMessage();

    }


    types.forEach(
        type => {

            html += `

                <div class="selection-card">

                    <div>

                        <div class="card-icon">
                            📝
                        </div>

                        <h3>
                            ${formatType(type)}
                        </h3>

                        <p>
                            ${capitalize(
                                currentState.subject
                            )}
                            ${formatType(type)}
                            examination papers.
                        </p>

                    </div>


                    <button
                        class="open-btn"
                        onclick="openType('${escapeJS(type)}')">

                        FUNGUA

                    </button>

                </div>

            `;

        }
    );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN TYPE
========================================================= */

function openType(type) {

    currentState.level =
        "regions";

    currentState.type =
        type;

    currentState.region =
        null;

    currentState.year =
        null;


    renderRegions();

}


/* =========================================================
   RENDER REGIONS
========================================================= */

function renderRegions() {

    updateBreadcrumb();


    const papers =
        getCurrentPapers();


    const regions =
        [
            ...new Set(

                papers

                    .filter(
                        paper =>
                            paper.type ===
                            currentState.type
                    )

                    .map(
                        paper =>
                            paper.region
                    )

                    .filter(Boolean)

            )
        ];


    let html = `

        <div class="step-title">

            <h2>
                📍 Region
            </h2>

            <p>
                Chagua mkoa.
            </p>

        </div>


        <div class="selection-grid">

    `;


    if (
        regions.length === 0
    ) {

        html += emptyMessage();

    }


    regions
        .sort()
        .forEach(
            region => {

                html += `

                    <div class="selection-card region-card">

                        <div>

                            <div class="card-icon">
                                📍
                            </div>

                            <h3>
                                ${formatRegion(
                                    region
                                )}
                            </h3>

                            <p>
                                Past papers
                                kutoka
                                ${formatRegion(
                                    region
                                )}.
                            </p>

                        </div>


                        <button
                            class="open-btn"
                            onclick="openRegion('${escapeJS(region)}')">

                            FUNGUA

                        </button>

                    </div>

                `;

            }
        );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN REGION
========================================================= */

function openRegion(region) {

    currentState.level =
        "years";

    currentState.region =
        region;

    currentState.year =
        null;


    renderYears();

}


/* =========================================================
   RENDER YEARS
========================================================= */

function renderYears() {

    updateBreadcrumb();


    const papers =
        getCurrentPapers();


    const years =
        [
            ...new Set(

                papers

                    .filter(
                        paper =>
                            paper.type ===
                            currentState.type
                    )

                    .filter(
                        paper =>
                            paper.region ===
                            currentState.region
                    )

                    .map(
                        paper =>
                            paper.year
                    )

                    .filter(Boolean)

            )
        ]
        .sort(
            (a,b) =>
                b - a
        );


    let html = `

        <div class="step-title">

            <h2>
                📅 Year
            </h2>

            <p>
                Chagua mwaka.
            </p>

        </div>


        <div class="selection-grid">

    `;


    if (
        years.length === 0
    ) {

        html += emptyMessage();

    }


    years.forEach(
        year => {

            html += `

                <div class="selection-card year-card">

                    <div>

                        <div class="card-icon">
                            📅
                        </div>

                        <h3>
                            ${year}
                        </h3>

                        <p>
                            Examination papers
                            for ${year}.
                        </p>

                    </div>


                    <button
                        class="open-btn"
                        onclick="openYear(${year})">

                        FUNGUA ${year}

                    </button>

                </div>

            `;

        }
    );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   OPEN YEAR
========================================================= */

function openYear(year) {

    currentState.level =
        "papers";

    currentState.year =
        Number(year);


    renderPapers();

}


/* =========================================================
   RENDER PAPERS
========================================================= */

function renderPapers() {

    updateBreadcrumb();


    const papers =
        getCurrentPapers()
            .filter(
                paper =>
                    paper.type ===
                    currentState.type
            )
            .filter(
                paper =>
                    paper.region ===
                    currentState.region
            )
            .filter(
                paper =>
                    Number(
                        paper.year
                    ) ===
                    Number(
                        currentState.year
                    )
            );


    let html = `

        <div class="step-title">

            <h2>
                📄 ${currentState.year}
            </h2>

            <p>
                Chagua paper unayotaka
                kufungua.
            </p>

        </div>


        <div class="selection-grid">

    `;


    if (
        papers.length === 0
    ) {

        html += emptyMessage();

    }


    papers.forEach(
        (paper, index) => {

            html += `

                <div class="selection-card paper-card">

                    <div>

                        <div class="card-icon">
                            📄
                        </div>

                        <h3>
                            ${paper.title ||
                            "Past Paper"}
                        </h3>

                        <p>
                            ${formatForm(
                                currentState.form
                            )}
                            —
                            ${capitalize(
                                currentState.subject
                            )}
                            —
                            ${formatType(
                                currentState.type
                            )}
                        </p>

                    </div>


                    <a
                        class="pdf-btn"
                        href="${escapeAttribute(
                            paper.file
                        )}"
                        target="_blank"
                        rel="noopener">

                        📄 OPEN PDF

                    </a>

                </div>

            `;

        }
    );


    html += `

        </div>

    `;


    container.innerHTML =
        html;

}


/* =========================================================
   EMPTY MESSAGE
========================================================= */

function emptyMessage() {

    return `

        <div class="selection-card empty-card">

            <div>

                <div class="card-icon">
                    📂
                </div>

                <h3>
                    Hakuna papers bado
                </h3>

                <p>
                    Hakuna past paper
                    iliyowekwa kwenye
                    category hii.
                </p>

            </div>

        </div>

    `;

}


/* =========================================================
   BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    let parts = [
        "Past Papers"
    ];


    if (
        currentState.form
    ) {

        parts.push(
            formatForm(
                currentState.form
            )
        );

    }


    if (
        currentState.subject
    ) {

        parts.push(
            capitalize(
                currentState.subject
            )
        );

    }


    if (
        currentState.type
    ) {

        parts.push(
            formatType(
                currentState.type
            )
        );

    }


    if (
        currentState.region
    ) {

        parts.push(
            formatRegion(
                currentState.region
            )
        );

    }


    if (
        currentState.year
    ) {

        parts.push(
            String(
                currentState.year
            )
        );

    }


    breadcrumb.innerHTML =
        parts.map(
            (
                part,
                index
            ) => {

                if (
                    index === 0
                ) {

                    return `
                        <span>
                            ${part}
                        </span>
                    `;

                }


                return `

                    <span class="separator">
                        ›
                    </span>

                    <span>
                        ${part}
                    </span>

                `;

            }
        ).join("");

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    switch (
        currentState.level
    ) {


        case "forms":

            window.location.href =
                "index.html";

            break;


        case "subjects":

            renderForms();

            break;


        case "types":

            currentState.level =
                "subjects";

            currentState.subject =
                null;

            renderSubjects();

            break;


        case "regions":

            currentState.level =
                "types";

            currentState.type =
                null;

            renderTypes();

            break;


        case "years":

            currentState.level =
                "regions";

            currentState.region =
                null;

            renderRegions();

            break;


        case "papers":

            currentState.level =
                "years";

            currentState.year =
                null;

            renderYears();

            break;

    }

}


/* =========================================================
   FORMATTING
========================================================= */

function capitalize(value) {

    if (!value) {

        return "";

    }


    return String(value)
        .charAt(0)
        .toUpperCase()
        +
        String(value)
            .slice(1);

}


/* =========================================================
   FORM
========================================================= */

function formatForm(form) {

    return String(form)
        .replace(
            "form",
            "Form "
        );

}


/* =========================================================
   TYPE
========================================================= */

function formatType(type) {

    const names = {

        "midterm":
            "Midterm",

        "terminal":
            "Terminal",

        "annual":
            "Annual",

        "joint":
            "Joint",

        "ftna":
            "FTNA",

        "mock":
            "Mock",

        "pre_necta":
            "Pre-NECTA",

        "acsee":
            "ACSEE"

    };


    return names[type]
        ||
        String(type)
            .replaceAll(
                "_",
                " "
            )
            .replace(
                /\b\w/g,
                char =>
                    char.toUpperCase()
            );

}


/* =========================================================
   REGION
========================================================= */

function formatRegion(region) {

    const names = {

        "dar_es_salaam":
            "Dar es Salaam",

        "dodoma":
            "Dodoma",

        "arusha":
            "Arusha",

        "mbeya":
            "Mbeya",

        "kagera":
            "Kagera",

        "shinyanga":
            "Shinyanga",

        "necta":
            "NECTA"

    };


    return names[region]
        ||
        String(region)
            .replaceAll(
                "_",
                " "
            )
            .replace(
                /\b\w/g,
                char =>
                    char.toUpperCase()
            );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(value) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        );

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleMenu() {

    const sidebar =
        document.getElementById(
            "sidebarMenu"
        );


    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    sidebar.classList.toggle(
        "active"
    );


    overlay.style.display =
        sidebar.classList.contains(
            "active"
        )
        ? "block"
        : "none";

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
